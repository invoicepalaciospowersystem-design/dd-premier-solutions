<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --brand-primary:#111827;
      --brand-accent:#dc2626;
      --login-bg-image:none;
    }

    body {
      font-family: Arial, sans-serif;
      background:#f3f4f6;
      margin:0;
      padding:20px;
      color:#111827;
      min-height:100vh;
      box-sizing:border-box;
    }

    body.login-mode {
      padding:0;
      overflow-x:hidden;
      background:#111214;
      position:relative;
    }

    body.login-mode::before {
      content:"";
      position:fixed;
      inset:0 46% 0 0;
      background:#17181c;
      border-right:8px solid var(--brand-primary);
      z-index:0;
    }

    body.login-mode.has-login-bg {
      background-image:
        linear-gradient(90deg, rgba(10,10,12,.92), rgba(10,10,12,.66), rgba(10,10,12,.28)),
        var(--login-bg-image);
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    body.login-mode.has-login-bg::before {
      background:rgba(17,18,20,.72);
      backdrop-filter:blur(2px);
    }

    .login-shell {
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(320px, 1.08fr) minmax(320px, 430px);
      align-items:center;
      justify-content:center;
      gap:clamp(28px, 5vw, 76px);
      padding:clamp(26px, 5vw, 68px);
      box-sizing:border-box;
      position:relative;
      z-index:1;
    }

    .login-brand {
      max-width:620px;
      color:white;
      text-shadow:0 2px 14px rgba(0,0,0,.34);
    }

    .brand-logo {
      display:none;
      max-width:min(460px, 82vw);
      max-height:270px;
      object-fit:contain;
      margin:0 0 22px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.72);
      border-radius:18px;
      padding:18px;
      box-sizing:border-box;
      filter:drop-shadow(0 22px 34px rgba(0,0,0,.34));
    }

    .login-kicker {
      display:inline-block;
      background:var(--brand-primary);
      border:1px solid rgba(255,255,255,.18);
      padding:8px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      text-transform:uppercase;
      letter-spacing:0;
      margin-bottom:16px;
    }

    .login-brand h1 {
      margin:0;
      font-size:clamp(36px, 5vw, 62px);
      line-height:1.05;
      letter-spacing:0;
      max-width:640px;
    }

    .login-brand p {
      font-size:clamp(17px, 1.8vw, 22px);
      line-height:1.45;
      margin:16px 0 0;
      color:rgba(255,255,255,.84);
      max-width:560px;
    }

    .brand-line {
      width:92px;
      height:5px;
      background:var(--brand-primary);
      border-radius:999px;
      margin:22px 0 0;
    }

    .box {
      max-width:420px;
      width:100%;
      background:#ffffff;
      padding:28px;
      border-radius:18px;
      border:1px solid rgba(17,24,39,.08);
      border-top:7px solid var(--brand-primary);
      box-shadow:0 28px 90px rgba(0,0,0,.30);
      box-sizing:border-box;
    }

    .box h2 {
      margin:0 0 6px;
      color:#111827;
    }

    .box-logo {
      display:none;
      width:132px;
      max-width:70%;
      max-height:110px;
      object-fit:contain;
      margin:0 auto 14px;
    }

    .panel {
      max-width:900px;
      margin:30px auto;
      background:white;
      padding:25px;
      border-radius:16px;
      box-shadow:0 4px 14px rgba(0,0,0,0.08);
      display:none;
    }

    .global-header {
      display:none;
      max-width:900px;
      margin:0 auto 15px auto;
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
    }

    input, button {
      width:100%;
      box-sizing:border-box;
      padding:14px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #d1d5db;
      font-size:15px;
    }

    input {
      background:#f9fafb;
      height:48px;
    }

    input:focus {
      outline:3px solid rgba(37,99,235,.15);
      border-color:var(--brand-primary);
      background:white;
    }

    button {
      background:var(--brand-primary);
      color:white;
      border:none;
      font-weight:bold;
      cursor:pointer;
      min-height:49px;
      box-shadow:0 10px 22px rgba(0,0,0,.16);
    }

    button:hover {
      filter:brightness(.95);
    }

    .muted {
      color:#6b7280;
      font-size:14px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:15px;
      margin-top:20px;
    }

    .module {
      background:#f9fafb;
      border:1px solid #e5e7eb;
      border-left:5px solid var(--brand-primary);
      border-radius:14px;
      padding:18px;
      cursor:pointer;
    }

    .module-title {
      font-size:18px;
      font-weight:bold;
      margin-bottom:6px;
    }

    .module-desc {
      font-size:14px;
      color:#6b7280;
      line-height:1.35;
    }

    #error {
      color:#dc2626;
      font-size:14px;
      margin-top:10px;
      font-weight:bold;
    }

    .login-footnote {
      border-top:1px solid #e5e7eb;
      margin-top:16px;
      padding-top:14px;
      color:#6b7280;
      font-size:12px;
      line-height:1.35;
    }

    .logout {
      background:#dc2626;
      max-width:180px;
    }

    @media (max-width: 800px) {
      body.login-mode::before {
        inset:0;
        border-right:none;
        border-bottom:6px solid var(--brand-primary);
      }

      .login-shell {
        align-items:stretch;
        grid-template-columns:1fr;
        justify-content:center;
        gap:22px;
        padding:22px;
      }

      .login-brand h1 {
        font-size:32px;
      }

      .login-brand p {
        font-size:16px;
      }

      .brand-logo {
        max-height:170px;
        padding:12px;
      }

      .box {
        max-width:none;
      }
    }
  </style>
</head>

<body class="login-mode">

<div id="loginShell" class="login-shell">
  <section class="login-brand">
    <img id="brandLogo" class="brand-logo" alt="">
    <div class="login-kicker" id="loginKicker">Company Login</div>
    <h1 id="heroTitle">D&D Premier Solutions Corp</h1>
    <p id="heroSubtitle">Sistema de ordenes y operaciones</p>
    <div class="brand-line"></div>
  </section>

  <div id="loginBox" class="box">
    <img id="loginLogo" class="box-logo" alt="">
    <h2 id="loginTitle">D&D Premier Solutions Corp</h2>
    <div class="muted" id="loginSubtitle">Login de acceso</div>

    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginButton" onclick="login()">Entrar</button>
    <div id="error"></div>
    <div class="login-footnote" id="loginFootnote">Powered by D&D Premier Solutions Corp</div>
  </div>
</div>

<div id="globalHeader" class="global-header">
  <div id="companyTitle" style="font-size:22px; font-weight:bold;">Company: Loading...</div>
  <div style="text-align:right;">
    <div id="ownerTitle" style="font-size:16px; font-weight:bold;">D&D Premier Solutions Corp</div>
    <div id="systemSubtitle" style="font-size:13px; color:#6b7280;">Sistema de Ordenes</div>
  </div>
</div>

<div id="mainPanel" class="panel">
  <h1>Panel Principal</h1>
  <div class="muted" id="userInfo"></div>

  <div id="modules" class="grid"></div>

  <button class="logout" onclick="logout()">Salir</button>
</div>

<script>
const BASE_URL = "<?= baseUrl ?>";
const LOGIN_COMPANY_ID = String("<?= companyId ?>").trim().toUpperCase();

let CURRENT_USER = null;
let CURRENT_BRANDING = {
  companyName: "D&D Premier Solutions Corp",
  loginTitle: "D&D Premier Solutions Corp",
  loginSubtitle: "Sistema de ordenes y operaciones",
  ownerName: "D&D Premier Solutions Corp",
  primaryColor: "#111827",
  accentColor: "#dc2626",
  backgroundImageUrl: "",
  logoImageUrl: ""
};

const MODULES = [
  {
    title: "Ordenes",
    desc: "Manejo de work orders, tecnicos y estados.",
    roles: ["OWNER", "ADMIN", "ORDENES"],
    url: "?view=orders"
  },
  {
    title: "Economia",
    desc: "Facturacion, costos, pagos y profit.",
    roles: ["OWNER", "ADMIN", "ECONOMIA"],
    url: "?view=economy"
  },
  {
    title: "Tiendas / Direcciones",
    desc: "Base de datos de NSN, direcciones y clientes.",
    roles: ["OWNER", "ADMIN"],
    url: "?view=stores"
  },
  {
    title: "Empresas",
    desc: "Administracion multi-empresa.",
    roles: ["OWNER"],
    url: "?view=companies"
  },
  {
    title: "Usuarios",
    desc: "Crear usuarios y asignar roles.",
    roles: ["OWNER", "ADMIN"],
    url: "?view=users"
  },
  {
    title: "Admin Portal Tecnico",
    desc: "Ver tecnicos, ordenes asignadas y abrir el portal de cada tecnico.",
    roles: ["OWNER", "ADMIN"],
    url: "?view=techAdmin"
  },
  {
    title: "Admin Portal Supervisor",
    desc: "Ver supervisores, tiendas asignadas y administrar asignaciones.",
    roles: ["OWNER", "ADMIN"],
    url: "?view=supervisorAdmin"
  },
  {
    title: "Portal Tecnico",
    desc: "Vista de ordenes para tecnicos.",
    roles: ["TECH"],
    url: "?view=tech&tech="
  },
  {
    title: "Portal Supervisor",
    desc: "Vista de estados para supervisores.",
    roles: ["SUPERVISOR"],
    url: "?view=customer&supervisor="
  }
];

function loadLoginBranding() {
  google.script.run
    .withSuccessHandler(function(branding) {
      applyBranding(branding || {});
    })
    .withFailureHandler(function() {
      applyBranding(CURRENT_BRANDING);
    })
    .getCompanyBranding(LOGIN_COMPANY_ID);
}

function applyBranding(branding) {
  CURRENT_BRANDING = Object.assign({}, CURRENT_BRANDING, branding || {});

  document.documentElement.style.setProperty(
    "--brand-primary",
    safeCssColor(CURRENT_BRANDING.primaryColor, "#111827")
  );
  document.documentElement.style.setProperty(
    "--brand-accent",
    safeCssColor(CURRENT_BRANDING.accentColor, "#dc2626")
  );

  document.getElementById("heroTitle").innerText =
    CURRENT_BRANDING.loginTitle || CURRENT_BRANDING.companyName || "D&D Premier Solutions Corp";
  document.getElementById("heroSubtitle").innerText =
    CURRENT_BRANDING.loginSubtitle || "Sistema de ordenes y operaciones";
  document.getElementById("loginTitle").innerText =
    CURRENT_BRANDING.loginTitle || CURRENT_BRANDING.companyName || "D&D Premier Solutions Corp";
  document.getElementById("loginSubtitle").innerText =
    CURRENT_BRANDING.loginSubtitle || "Login de acceso";
  document.getElementById("ownerTitle").innerText =
    CURRENT_BRANDING.ownerName || "D&D Premier Solutions Corp";
  document.getElementById("loginKicker").innerText =
    (CURRENT_BRANDING.companyId ? CURRENT_BRANDING.companyId + " Login" : "System Login");
  document.getElementById("loginFootnote").innerText =
    "Powered by " + (CURRENT_BRANDING.ownerName || "D&D Premier Solutions Corp");

  applyLogo(CURRENT_BRANDING.logoImageUrl);

  const bg = String(CURRENT_BRANDING.backgroundImageUrl || "").trim();
  if (bg) {
    document.body.classList.add("has-login-bg");
    document.documentElement.style.setProperty("--login-bg-image", "url('" + cssUrl(bg) + "')");
  } else {
    document.body.classList.remove("has-login-bg");
    document.documentElement.style.setProperty("--login-bg-image", "none");
  }
}

function applyLogo(url) {
  url = safeImageUrl(url);

  ["brandLogo", "loginLogo"].forEach(function(id) {
    const img = document.getElementById(id);

    if (!url) {
      img.style.display = "none";
      img.removeAttribute("src");
      return;
    }

    img.src = url;
    img.style.display = "block";
  });
}

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  document.getElementById("error").innerText = "";
  document.getElementById("loginButton").disabled = true;
  document.getElementById("loginButton").innerText = "Entrando...";

  google.script.run
    .withSuccessHandler(function(user) {
      CURRENT_USER = user || {};
      localStorage.setItem("pps_user", JSON.stringify(CURRENT_USER));
      localStorage.setItem("pps_login_company", LOGIN_COMPANY_ID || "");
      showPanel();
    })
    .withFailureHandler(function(err) {
      document.getElementById("error").innerText = err.message || err;
      document.getElementById("loginButton").disabled = false;
      document.getElementById("loginButton").innerText = "Entrar";
    })
    .loginUserForCompany(email, password, LOGIN_COMPANY_ID);
}

function normalizeUser(user) {
  user = user || {};

  return {
    success: user.success,
    email: user.email || user.EMAIL || "",
    name: user.name || user.NAME || "",
    role: String(user.role || user.ROLE || "").trim().toUpperCase(),
    companyId: String(user.companyId || user.COMPANY_ID || "").trim().toUpperCase()
  };
}

function showPanel() {
  CURRENT_USER = normalizeUser(CURRENT_USER);

  document.body.classList.remove("login-mode");
  document.getElementById("loginShell").style.display = "none";
  document.getElementById("globalHeader").style.display = "flex";
  document.getElementById("mainPanel").style.display = "block";

  updateHeaderCompany(getActiveCompanyId());

  document.getElementById("userInfo").innerText =
    CURRENT_USER.name + " | " + CURRENT_USER.role + " | Company: " + CURRENT_USER.companyId;

  renderModules();
}

function renderModules() {
  const role = String(CURRENT_USER.role || "").trim().toUpperCase();

  const allowed = MODULES.filter(function(m) {
    return m.roles.includes(role);
  });

  if (!allowed.length) {
    document.getElementById("modules").innerHTML = `
      <div class="module">
        <div class="module-title">No hay modulos disponibles</div>
        <div class="module-desc">
          Rol detectado: <b>${role || "VACIO"}</b><br>
          Company: <b>${CURRENT_USER.companyId || "VACIO"}</b><br>
          Revisa la hoja USERS: ROLE debe ser OWNER, ADMIN, TECH, SUPERVISOR, ECONOMIA u ORDENES.
        </div>
      </div>
    `;
    return;
  }

  document.getElementById("modules").innerHTML =
    allowed.map(function(m) {
      return `
        <div class="module" onclick="openModule('${m.url}')">
          <div class="module-title">${m.title}</div>
          <div class="module-desc">${m.desc}</div>
        </div>
      `;
    }).join("");
}

function openModule(url) {
  const companyId = getActiveCompanyId();
  let finalUrl;

  if (url === "?view=tech&tech=") {
    finalUrl = BASE_URL + url + encodeURIComponent(CURRENT_USER.name);
  } else if (url === "?view=customer&supervisor=") {
    finalUrl = BASE_URL + url + encodeURIComponent(CURRENT_USER.name);
  } else {
    finalUrl = BASE_URL + url;
  }

  finalUrl = appendCompanyParam(finalUrl, companyId);
  window.top.location.href = finalUrl;
}

function getActiveCompanyId() {
  return LOGIN_COMPANY_ID || String(CURRENT_USER && CURRENT_USER.companyId || "").trim().toUpperCase();
}

function appendCompanyParam(url, companyId) {
  companyId = String(companyId || "").trim().toUpperCase();
  if (!companyId || /[?&]companyId=/.test(url)) return url;

  return url + (url.indexOf("?") === -1 ? "?" : "&") +
    "companyId=" + encodeURIComponent(companyId);
}

function updateHeaderCompany(companyId) {
  companyId = String(companyId || "").toUpperCase();

  if (!companyId) {
    document.getElementById("companyTitle").innerText = "Company: Loading...";
    return;
  }

  google.script.run
    .withSuccessHandler(function(branding) {
      branding = branding || {};
      document.getElementById("companyTitle").innerText =
        "Company: " + (branding.companyName || companyId);
      document.getElementById("ownerTitle").innerText =
        branding.ownerName || CURRENT_BRANDING.ownerName || "D&D Premier Solutions Corp";
      document.getElementById("systemSubtitle").innerText =
        branding.loginSubtitle || "Sistema de Ordenes";
    })
    .withFailureHandler(function() {
      document.getElementById("companyTitle").innerText =
        "Company: " + companyId;
    })
    .getCompanyBranding(companyId);
}

function logout() {
  localStorage.removeItem("pps_user");
  localStorage.removeItem("pps_login_company");
  CURRENT_USER = null;

  document.body.classList.add("login-mode");
  document.getElementById("globalHeader").style.display = "none";
  document.getElementById("mainPanel").style.display = "none";
  document.getElementById("loginShell").style.display = "flex";
  document.getElementById("password").value = "";
  document.getElementById("loginButton").disabled = false;
  document.getElementById("loginButton").innerText = "Entrar";
}

function canUseSavedUser(user) {
  const normalized = normalizeUser(user);

  if (!LOGIN_COMPANY_ID) return true;
  if (normalized.role === "OWNER") return true;

  return normalized.companyId === LOGIN_COMPANY_ID;
}

function safeCssColor(value, fallback) {
  value = String(value || "").trim();
  return /^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(value) ? value : fallback;
}

function cssUrl(value) {
  return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function safeImageUrl(value) {
  value = String(value || "").trim();
  return /^https:\/\//i.test(value) || /^data:image\//i.test(value) ? value : "";
}

window.onload = function() {
  loadLoginBranding();

  const saved = localStorage.getItem("pps_user");

  if (saved) {
    try {
      const parsed = JSON.parse(saved);

      if (canUseSavedUser(parsed)) {
        CURRENT_USER = parsed;
        showPanel();
      } else {
        localStorage.removeItem("pps_user");
      }
    } catch (e) {
      localStorage.removeItem("pps_user");
    }
  }
};
</script>

</body>
</html>
