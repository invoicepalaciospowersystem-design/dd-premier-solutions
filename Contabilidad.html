<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --panel:#ffffff;
      --dark:#111827;
      --blue:#2563eb;
      --green:#16a34a;
      --orange:#f59e0b;
      --red:#dc2626;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      padding:20px;
      font-family:Arial, sans-serif;
      color:var(--ink);
      background:#f3f4f6;
    }

    button,
    input,
    select {
      min-height:40px;
      border-radius:9px;
      border:1px solid #d1d5db;
      padding:9px 11px;
      font:inherit;
    }

    button {
      border:0;
      background:var(--dark);
      color:#ffffff;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover { filter:brightness(1.07); }

    .shell {
      width:min(1240px, 100%);
      margin:0 auto;
    }

    .header,
    .toolbar,
    .panel {
      background:rgba(255,255,255,.94);
      border:1px solid rgba(229,231,235,.9);
      border-radius:14px;
      box-shadow:0 10px 24px rgba(15,23,42,.08);
    }

    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:18px 20px;
      border-top:5px solid var(--red);
      margin-bottom:14px;
    }

    .eyebrow {
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:11px;
      font-weight:bold;
      color:var(--muted);
      margin-bottom:4px;
    }

    h1,
    h2,
    h3 {
      margin:0;
      line-height:1.15;
    }

    h1 { font-size:30px; }
    h2 { font-size:20px; }
    h3 { font-size:16px; }

    .muted {
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
    }

    .toolbar {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      padding:14px;
      margin-bottom:14px;
    }

    .toolbar select,
    .toolbar input {
      background:#ffffff;
    }

    .company-panel {
      display:none;
      align-items:center;
      gap:10px;
      width:100%;
      padding-bottom:2px;
    }

    .company-panel select {
      min-width:min(360px, 100%);
    }

    .metrics {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:12px;
      margin-bottom:14px;
    }

    .metric {
      min-height:116px;
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-left:5px solid var(--blue);
      border-radius:12px;
      padding:14px;
      box-shadow:0 7px 18px rgba(15,23,42,.08);
    }

    .metric.success { border-left-color:var(--green); }
    .metric.warning { border-left-color:var(--orange); }
    .metric.danger { border-left-color:var(--red); }
    .metric.neutral { border-left-color:#64748b; }

    .metric-label {
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .metric-value {
      font-size:27px;
      font-weight:900;
      line-height:1.1;
      overflow-wrap:anywhere;
    }

    .metric-note {
      margin-top:8px;
      color:#4b5563;
      font-size:12px;
      line-height:1.3;
    }

    .layout {
      display:grid;
      grid-template-columns:minmax(0, 1.2fr) minmax(320px, .8fr);
      gap:14px;
      align-items:start;
    }

    .panel {
      padding:16px;
    }

    .panel-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .rows {
      display:grid;
      gap:8px;
    }

    .summary-row {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid #eef2f7;
    }

    .summary-row:last-child {
      border-bottom:0;
    }

    .summary-label {
      color:#374151;
      font-weight:bold;
    }

    .summary-value {
      font-weight:900;
      text-align:right;
      white-space:nowrap;
    }

    .pill {
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:5px 10px;
      border-radius:999px;
      background:#dbeafe;
      color:#1e40af;
      font-weight:bold;
      font-size:12px;
    }

    .actions {
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .error {
      display:none;
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#fef2f2;
      color:#991b1b;
      border:1px solid #fecaca;
      font-weight:bold;
    }

    .loading {
      color:var(--muted);
      padding:18px;
      background:rgba(255,255,255,.92);
      border-radius:12px;
      border:1px solid var(--line);
    }

    @media (max-width:840px) {
      body { padding:12px; }
      .header { align-items:flex-start; flex-direction:column; }
      h1 { font-size:26px; }
      .toolbar > * { width:100%; }
      .layout { grid-template-columns:1fr; }
    }
  </style>
  <?!= include("AppWatermark"); ?>
</head>

<body class="app-watermark" style="--company-watermark-logo:<?!= watermarkLogoCss ?>;">

<?!= include("AppBackButton"); ?>

<div class="shell">
  <div class="header">
    <div>
      <div class="eyebrow">Modulo</div>
      <h1>Contabilidad</h1>
      <div class="muted" id="accountingScope">Cargando...</div>
    </div>
    <button type="button" onclick="openEconomy()">Abrir Economia</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="toolbar">
    <div class="company-panel" id="companyPanel">
      <strong>Empresa</strong>
      <select id="companySelect" onchange="activateCompany()"></select>
    </div>

    <select id="periodMode" onchange="onPeriodModeChange()">
      <option value="monthly">Mensual</option>
      <option value="annual">Anual</option>
      <option value="all">Todos</option>
    </select>

    <select id="periodMonth" onchange="loadAccounting()">
      <option value="1">Enero</option>
      <option value="2">Febrero</option>
      <option value="3">Marzo</option>
      <option value="4">Abril</option>
      <option value="5">Mayo</option>
      <option value="6">Junio</option>
      <option value="7">Julio</option>
      <option value="8">Agosto</option>
      <option value="9">Septiembre</option>
      <option value="10">Octubre</option>
      <option value="11">Noviembre</option>
      <option value="12">Diciembre</option>
    </select>

    <input id="periodYear" type="number" min="2020" max="2100" step="1" onchange="loadAccounting()">
    <button type="button" onclick="loadAccounting()">Actualizar</button>
  </div>

  <div class="metrics" id="metrics">
    <div class="loading">Cargando metricas contables...</div>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Resumen Contable</h2>
          <div class="muted" id="recordsNote">Esperando datos...</div>
        </div>
        <span class="pill" id="periodLabel">Periodo</span>
      </div>
      <div class="rows" id="accountingRows"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Inversionistas</h2>
          <div class="muted">Distribucion de parts por fuente de inversion.</div>
        </div>
      </div>
      <div class="rows" id="investorRows"></div>
      <div class="actions">
        <button type="button" onclick="openEconomy()">Abrir Economia Completa</button>
      </div>
    </section>
  </div>
</div>

<script>
const BASE_URL = "<?= baseUrl ?>";
const LOGIN_COMPANY_ID = String("<?= companyId ?>").trim().toUpperCase();
const OWNER_ONLY_LOGIN = String("<?= ownerOnly ?>").trim().toLowerCase() === "true";

let CURRENT_USER = null;
let ACTIVE_COMPANY_ID = "";
let COMPANIES = [];

function navigateApp(url) {
  const target = String(url || "").trim();
  if (!target) return;

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "PPS_NAVIGATE", url: target }, "*");
      setTimeout(function() {
        try {
          window.open(target, "_top");
        } catch (err) {
          window.location.href = target;
        }
      }, 250);
      return;
    }
  } catch (err) {}

  try {
    window.open(target, "_top");
  } catch (err) {
    window.location.href = target;
  }
}

function getStoredUser() {
  try {
    return JSON.parse(getAppSessionItem("pps_user") || "{}");
  } catch (err) {
    return {};
  }
}

function getSessionToken() {
  try {
    const directToken = getAppSessionItem("pps_session_token") || "";
    if (directToken) return directToken;

    const user = getStoredUser();
    return String(user.sessionToken || user.SESSION_TOKEN || "").trim();
  } catch (err) {
    return "";
  }
}

function redirectLogin() {
  try {
    removeAppSessionItem("pps_user");
  } catch (err) {}

  let url = BASE_URL || window.location.href.split("?")[0];
  const params = [];
  if (LOGIN_COMPANY_ID) params.push("companyId=" + encodeURIComponent(LOGIN_COMPANY_ID));
  if (OWNER_ONLY_LOGIN) params.push("ownerOnly=1");
  if (params.length) url += (url.indexOf("?") === -1 ? "?" : "&") + params.join("&");
  navigateApp(url);
}

function requireAccountingLogin() {
  const user = getStoredUser();
  const role = String(user.role || user.ROLE || "").trim().toUpperCase();
  const token = getSessionToken();
  const expiresAt = Number(user.sessionExpiresAt || user.SESSION_EXPIRES_AT || 0);
  const allowed = ["OWNER", "ADMIN", "ECONOMIA"];

  if (!token || (expiresAt && expiresAt <= Date.now()) || allowed.indexOf(role) === -1) {
    redirectLogin();
    return false;
  }

  CURRENT_USER = user;
  return true;
}

function getOwnerSelectionStorageKey() {
  return "owner_selected_company_" + (LOGIN_COMPANY_ID || "ALL");
}

function getInitialCompanyId() {
  const role = String(CURRENT_USER && CURRENT_USER.role || "").trim().toUpperCase();
  if (role === "OWNER") {
    if (LOGIN_COMPANY_ID) return LOGIN_COMPANY_ID;
    try {
      return String(getAppSessionItem(getOwnerSelectionStorageKey()) || "").trim().toUpperCase();
    } catch (err) {
      return "";
    }
  }

  return LOGIN_COMPANY_ID ||
    String(CURRENT_USER && (CURRENT_USER.companyId || CURRENT_USER.COMPANY_ID) || "").trim().toUpperCase();
}

function initPeriodControls() {
  const now = new Date();
  document.getElementById("periodMonth").value = String(now.getMonth() + 1);
  document.getElementById("periodYear").value = String(now.getFullYear());
  syncPeriodControls();
}

function syncPeriodControls() {
  const mode = String(document.getElementById("periodMode").value || "monthly");
  document.getElementById("periodMonth").style.display = mode === "monthly" ? "" : "none";
  document.getElementById("periodYear").style.display = mode === "all" ? "none" : "";
}

function onPeriodModeChange() {
  syncPeriodControls();
  loadAccounting();
}

function getPeriodSelection() {
  return {
    mode: String(document.getElementById("periodMode").value || "monthly"),
    month: Number(document.getElementById("periodMonth").value || (new Date().getMonth() + 1)),
    year: Number(document.getElementById("periodYear").value || new Date().getFullYear())
  };
}

function loadCompaniesIfNeeded() {
  const role = String(CURRENT_USER && CURRENT_USER.role || "").trim().toUpperCase();
  if (role !== "OWNER" || LOGIN_COMPANY_ID) {
    return;
  }

  document.getElementById("companyPanel").style.display = "flex";
  google.script.run
    .withSuccessHandler(function(rows) {
      COMPANIES = Array.isArray(rows) ? rows : [];
      renderCompanySelect();
      loadAccounting();
    })
    .withFailureHandler(function(err) {
      showError("Error cargando empresas: " + getErrorMessage(err));
    })
    .getCompaniesForUser("", "OWNER", getSessionToken());
}

function renderCompanySelect() {
  const select = document.getElementById("companySelect");
  if (!select) return;

  const options = COMPANIES.map(function(c) {
    const id = String(c.COMPANY_ID || c.companyId || "").trim().toUpperCase();
    const name = String(c.COMPANY_NAME || c.NAME || c.companyName || id).trim();
    return { id:id, name:name || id };
  }).filter(function(c) {
    return c.id;
  });

  if (!ACTIVE_COMPANY_ID && options.length) {
    ACTIVE_COMPANY_ID = options[0].id;
  }

  select.innerHTML = options.map(function(c) {
    return "<option value='" + escapeHtml(c.id) + "'>" + escapeHtml(c.name) + "</option>";
  }).join("");

  if (ACTIVE_COMPANY_ID) select.value = ACTIVE_COMPANY_ID;
}

function activateCompany() {
  const select = document.getElementById("companySelect");
  ACTIVE_COMPANY_ID = String(select && select.value || "").trim().toUpperCase();
  try {
    setAppSessionItem(getOwnerSelectionStorageKey(), ACTIVE_COMPANY_ID);
  } catch (err) {}
  loadAccounting();
}

function showError(message) {
  const box = document.getElementById("errorBox");
  if (!box) return;
  box.style.display = "block";
  box.textContent = String(message || "Error");
}

function clearError() {
  const box = document.getElementById("errorBox");
  if (!box) return;
  box.style.display = "none";
  box.textContent = "";
}

function getErrorMessage(err) {
  return String(err && err.message ? err.message : err || "Error");
}

function loadAccounting() {
  clearError();

  if (!ACTIVE_COMPANY_ID) {
    document.getElementById("accountingScope").textContent = "Seleccione una empresa.";
    document.getElementById("metrics").innerHTML = "<div class='loading'>Seleccione una empresa para ver contabilidad.</div>";
    document.getElementById("accountingRows").innerHTML = "";
    document.getElementById("investorRows").innerHTML = "";
    return;
  }

  const period = getPeriodSelection();
  document.getElementById("metrics").innerHTML = "<div class='loading'>Cargando metricas contables...</div>";
  document.getElementById("accountingScope").textContent = "Cargando contabilidad...";

  google.script.run
    .withSuccessHandler(renderAccounting)
    .withFailureHandler(function(err) {
      if (isSessionExpired(err)) {
        redirectLogin();
        return;
      }
      showError("Error cargando contabilidad: " + getErrorMessage(err));
      document.getElementById("metrics").innerHTML = "";
    })
    .getAccountingDashboardData(
      getSessionToken(),
      ACTIVE_COMPANY_ID,
      period.mode,
      period.year,
      period.month
    );
}

function isSessionExpired(err) {
  return /sesion expirada|session/i.test(getErrorMessage(err));
}

function renderAccounting(data) {
  data = data || {};
  const totals = data.totals || {};
  const investors = data.investors || {};

  document.getElementById("accountingScope").textContent =
    (data.companyName || data.companyId || ACTIVE_COMPANY_ID) +
    " | " + (data.periodLabel || "Periodo actual") +
    " | Actualizado " + (data.generatedAt || "");

  document.getElementById("periodLabel").textContent = data.periodLabel || "Periodo";
  document.getElementById("recordsNote").textContent =
    Number(totals.economyRows || 0) + " registros contables en la vista seleccionada.";

  const metricCards = [
    { label:"Total Facturado", value:formatMoney(totals.totalBilled || 0), note:"Invoice total amount", tone:"info" },
    { label:"Tax", value:formatMoney(totals.taxTotal || 0), note:"Tax collected", tone:"neutral" },
    { label:"Cobro Parts", value:formatMoney(totals.partsBilled || 0), note:"Parts cobradas", tone:"info" },
    { label:"Cobro Horas", value:formatMoney(totals.laborBilled || 0), note:formatNumber(totals.laborHours || 0) + " horas", tone:"info" },
    { label:"Gasto Real Parts", value:formatMoney(totals.partsCost || 0), note:"Costo real registrado", tone:Number(totals.partsCost || 0) ? "warning" : "success" },
    { label:"Tech Pay", value:formatMoney(totals.techLaborCost || 0), note:"Pago labor tecnicos", tone:"warning" },
    { label:"Profit", value:formatMoney(totals.grossProfit || 0), note:"Facturado - tax - costo - labor", tone:Number(totals.grossProfit || 0) >= 0 ? "success" : "danger" },
    { label:"Pendiente", value:String(Number(totals.economyPending || 0)), note:"Registros pendientes", tone:Number(totals.economyPending || 0) ? "danger" : "success" }
  ];

  document.getElementById("metrics").innerHTML =
    metricCards.map(renderMetric).join("");

  document.getElementById("accountingRows").innerHTML = [
    ["Economy Records", totals.economyRows || 0],
    ["Invoiced", totals.economyInvoiced || 0],
    ["Paid", totals.economyPaid || 0],
    ["Total Facturado", formatMoney(totals.totalBilled || 0)],
    ["Tax", formatMoney(totals.taxTotal || 0)],
    ["Cobro Parts", formatMoney(totals.partsBilled || 0)],
    ["Cobro Horas", formatMoney(totals.laborBilled || 0)],
    ["Gasto Real Parts", formatMoney(totals.partsCost || 0)],
    ["Pago Labor Tecnicos", formatMoney(totals.techLaborCost || 0)],
    ["Profit", formatMoney(totals.grossProfit || 0)]
  ].map(renderSummaryRow).join("");

  document.getElementById("investorRows").innerHTML = [
    ["David Parts", formatMoney(investors.davidPartsCost || 0)],
    ["Yoel Parts", formatMoney(investors.yoelPartsCost || 0)],
    ["Sin INV_SOURCE", formatMoney(investors.unassignedPartsCost || 0)]
  ].map(renderSummaryRow).join("");
}

function renderMetric(card) {
  return [
    "<div class='metric " + escapeHtml(card.tone || "") + "'>",
    "<div class='metric-label'>" + escapeHtml(card.label) + "</div>",
    "<div class='metric-value'>" + escapeHtml(card.value) + "</div>",
    "<div class='metric-note'>" + escapeHtml(card.note || "") + "</div>",
    "</div>"
  ].join("");
}

function renderSummaryRow(row) {
  return [
    "<div class='summary-row'>",
    "<div class='summary-label'>" + escapeHtml(row[0]) + "</div>",
    "<div class='summary-value'>" + escapeHtml(row[1]) + "</div>",
    "</div>"
  ].join("");
}

function openEconomy() {
  let url = BASE_URL + "?view=economy";
  if (ACTIVE_COMPANY_ID) url += "&companyId=" + encodeURIComponent(ACTIVE_COMPANY_ID);
  if (OWNER_ONLY_LOGIN) url += "&ownerOnly=1";
  navigateApp(url);
}

function formatMoney(value) {
  const n = Number(value || 0);
  return "$" + n.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function formatNumber(value) {
  const n = Number(value || 0);
  return n.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function escapeHtml(value) {
  return String(value === undefined || value === null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function initAccounting() {
  if (!requireAccountingLogin()) return;
  ACTIVE_COMPANY_ID = getInitialCompanyId();
  initPeriodControls();
  loadCompaniesIfNeeded();
  if (ACTIVE_COMPANY_ID) loadAccounting();
}

document.addEventListener("DOMContentLoaded", initAccounting);
</script>

</body>
</html>
