<style>
  .app-backbar {
    width:100%;
    margin:0 0 12px;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:10px;
    position:sticky;
    top:8px;
    z-index:30;
  }

  .app-back-button {
    width:auto !important;
    min-width:118px;
    min-height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 14px !important;
    margin:0 !important;
    border:0 !important;
    border-radius:10px !important;
    background:#111827 !important;
    color:#ffffff !important;
    font-weight:bold !important;
    font-size:14px !important;
    line-height:1 !important;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(15,23,42,.18);
    text-decoration:none;
  }

  .app-back-button:hover {
    filter:brightness(1.08);
  }

  @media (max-width:700px) {
    .app-backbar {
      top:0;
      margin-bottom:10px;
      padding:6px 0;
      background:rgba(243,244,246,.88);
      backdrop-filter:blur(8px);
    }

    .app-back-button {
      width:100% !important;
      min-height:46px;
    }
  }
</style>

<div class="app-backbar">
  <button class="app-back-button" type="button" onclick="goAppBack()">
    &larr; Back
  </button>
</div>

<script>
function getAppSessionItem(key) {
  try {
    const value = sessionStorage.getItem(key);
    if (value !== null && value !== undefined) return value;
  } catch (err) {}

  try {
    return localStorage.getItem(key) || "";
  } catch (err) {
    return "";
  }
}

function setAppSessionItem(key, value) {
  try {
    sessionStorage.setItem(key, value);
    return true;
  } catch (err) {
    return false;
  }
}

function removeAppSessionItem(key) {
  try {
    sessionStorage.removeItem(key);
  } catch (err) {}

  try {
    localStorage.removeItem(key);
  } catch (err) {}
}

(function() {
  var APP_BACK_PUBLIC_URLS = {
    PPS: "https://app.palaciospowersystems.com/",
    OWNER: "https://app.ddpremiersolutionscorp.com/"
  };

  function getSearchParams() {
    try {
      return new URLSearchParams(window.location.search || "");
    } catch (err) {
      return new URLSearchParams("");
    }
  }

  function getStoredUser() {
    try {
      return JSON.parse(getAppSessionItem("pps_user") || "{}");
    } catch (err) {
      return {};
    }
  }

  function getStoredCompanyId() {
    var params = getSearchParams();
    var user = getStoredUser();

    var companyId =
      String(params.get("companyId") || "").trim().toUpperCase() ||
      String(getAppSessionItem("pps_login_company") || "").trim().toUpperCase() ||
      String(getAppSessionItem("owner_selected_company_ALL") || "").trim().toUpperCase() ||
      String(user.companyId || user.COMPANY_ID || "").trim().toUpperCase();

    return companyId;
  }

  function isOwnerPortal() {
    var params = getSearchParams();
    var user = getStoredUser();
    var role = String(user.role || user.ROLE || "").trim().toUpperCase();
    var ownerOnly = String(params.get("ownerOnly") || params.get("portal") || "").trim().toLowerCase();

    return ownerOnly === "1" ||
      ownerOnly === "true" ||
      ownerOnly === "owner" ||
      (role === "OWNER" && !getStoredCompanyId());
  }

  function appendParam(url, key, value) {
    if (!value) return url;
    if (new RegExp("[?&]" + key + "=").test(url)) return url;

    return url + (url.indexOf("?") === -1 ? "?" : "&") +
      key + "=" + encodeURIComponent(value);
  }

  function isUnsafeBackUrl(value) {
    value = String(value || "").trim();
    return !value ||
      value.indexOf("<?= ") !== -1 ||
      value.indexOf("<?=") !== -1 ||
      /script\.googleusercontent\.com/i.test(value);
  }

  function getPublicBaseUrl(companyId) {
    if (isOwnerPortal()) return APP_BACK_PUBLIC_URLS.OWNER;
    if (companyId && APP_BACK_PUBLIC_URLS[companyId]) return APP_BACK_PUBLIC_URLS[companyId];

    return APP_BACK_PUBLIC_URLS.OWNER;
  }

  function normalizeBackUrl(raw) {
    if (isUnsafeBackUrl(raw)) return "";

    try {
      var parsed = new URL(String(raw), getPublicBaseUrl(getStoredCompanyId()));

      if (parsed.protocol !== "https:") return "";

      if (parsed.hostname === "script.google.com") {
        var publicUrl = new URL(getPublicBaseUrl(getStoredCompanyId()));
        publicUrl.search = parsed.search;
        publicUrl.hash = parsed.hash;
        return publicUrl.href;
      }

      if (/script\.googleusercontent\.com/i.test(parsed.hostname)) return "";

      return parsed.href;
    } catch (err) {
      return "";
    }
  }

  function getBackTarget() {
    var params = getSearchParams();
    var returnTo = normalizeBackUrl(params.get("returnTo"));
    if (returnTo) return returnTo;

    var companyId = getStoredCompanyId();
    var url = getPublicBaseUrl(companyId);

    if (isOwnerPortal()) {
      url = appendParam(url, "ownerOnly", "1");
    }

    if (companyId) {
      url = appendParam(url, "companyId", companyId);
    }

    return url;
  }

  function getParentMessageUrl(url) {
    try {
      var target = new URL(url);
      if (target.hostname === "app.palaciospowersystems.com" ||
          target.hostname === "app.ddpremiersolutionscorp.com" ||
          target.hostname === "ddpremiersolutionscorp.com" ||
          target.hostname === "www.ddpremiersolutionscorp.com") {
        return target.pathname + target.search + target.hash;
      }
    } catch (err) {}

    return url;
  }

  function navigateBackTarget(url) {
    var target = String(url || "").trim();
    if (!target) return;

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "PPS_NAVIGATE", url: getParentMessageUrl(target) }, "*");
        setTimeout(function() {
          try {
            window.open(target, "_top");
          } catch (err) {
            window.location.href = target;
          }
        }, 250);
        return;
      }
    } catch (err) {}

    try {
      window.open(target, "_top");
    } catch (err) {
      window.location.href = target;
    }
  }

  window.goAppBack = function() {
    navigateBackTarget(getBackTarget());
  };
})();
</script>
