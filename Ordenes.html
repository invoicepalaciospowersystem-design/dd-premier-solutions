function navigateApp(url) {
  const target = String(url || "").trim();
  if (!target) return;

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "PPS_NAVIGATE", url: target }, "*");
      setTimeout(function() {
        try {
          window.open(target, "_top");
        } catch (err) {
          window.location.href = target;
        }
      }, 250);
      return;
    }
  } catch (err) {}

  try {
    window.open(target, "_top");
  } catch (err) {
    window.location.href = target;
  }
}

const TOP_NAV = {
  set href(url) {
    navigateApp(url);
  }
};

const BASE_URL = "<?= baseUrl ?>";
const URL_COMPANY_ID = String("<?= companyId ?>").trim().toUpperCase();
const OWNER_PORTAL = String("<?= ownerOnly ?>").trim().toLowerCase() === "true";

function clearStoredSession() {
  removeAppSessionItem("pps_user");
}

function redirectToLogin(message) {
  clearStoredSession();
  if (message) alert(message);
  TOP_NAV.href = OWNER_PORTAL ? BASE_URL + "?ownerOnly=1" : BASE_URL;
}

function getErrorMessage(err) {
  return String((err && err.message) || err || "Error desconocido");
}

function isSessionExpiredError(err) {
  const message = getErrorMessage(err).toLowerCase();
  return message.includes("sesion expirada") || message.includes("sesión expirada") || message.includes("session expired");
}

function handleSessionFailure(err) {
  if (!isSessionExpiredError(err)) return false;
  redirectToLogin("Tu sesión expiró. Inicia sesión nuevamente.");
  return true;
}

function renderServerError(err, elementId, prefix) {
  if (handleSessionFailure(err)) return;
  document.getElementById(elementId).innerHTML = prefix + getErrorMessage(err);
}

function alertServerError(err) {
  if (handleSessionFailure(err)) return;
  alert(getErrorMessage(err));
}

function requireLogin() {
  const user = getAppSessionItem("pps_user");

  if (!user) {
    TOP_NAV.href = BASE_URL;
    return false;
  }

  try {
    const parsed = JSON.parse(user);
    if ((!parsed.role && !parsed.ROLE) || (!parsed.sessionToken && !parsed.SESSION_TOKEN)) {
      redirectToLogin();
      return false;
    }

    const expiresAt = Number(parsed.sessionExpiresAt || parsed.SESSION_EXPIRES_AT || 0);
    if (expiresAt && expiresAt <= Date.now()) {
      redirectToLogin("Tu sesión expiró. Inicia sesión nuevamente.");
      return false;
    }
  } catch (e) {
    redirectToLogin();
    return false;
  }

  return true;
}

if (!requireLogin()) {
  throw new Error("No autorizado");
}

let data = [];
let ACTIVE_COMPANY_ID = URL_COMPANY_ID;
let ORDERS_RENDER_LIMIT = 80;
const ORDERS_RENDER_STEP = 80;
let ORDERS_FILTER_KEY = "";

function getCurrentUser() {
  try {
    return JSON.parse(getAppSessionItem("pps_user") || "{}");
  } catch (e) {
    return {};
  }
}

function getSessionToken() {
  const user = getCurrentUser();
  return user.sessionToken || user.SESSION_TOKEN || "";
}

function getCurrentCompanyId() {
  const user = getCurrentUser();
  return String(user.companyId || "").toUpperCase();
}

function getCurrentRole() {
  const user = getCurrentUser();
  return String(user.role || user.ROLE || "").toUpperCase();
}

function normalizeRole(role) {
  return String(role || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .trim();
}

function canCreateQuote() {
  const role = normalizeRole(getCurrentRole());
  return ["ADMIN", "SYSTEM", "ORDENES", "OWNER"].includes(role);
}

function canDeleteWO() {
  const role = normalizeRole(getCurrentRole());
  return ["ADMIN", "SYSTEM", "ORDENES"].includes(role);
}

function canCreateSpecialInvoice() {
  const role = normalizeRole(getCurrentRole());
  return ["ADMIN", "SYSTEM", "ORDENES", "OWNER"].includes(role);
}

function isPMOrderCard(order) {
  return String(order && order.WO_TYPE || "").trim().toUpperCase() === "PM_FORM";
}

function openQuote(row, woNumber, companyId) {
  TOP_NAV.href =
    BASE_URL +
    "?view=quote" +
    "&row=" + encodeURIComponent(row) +
    "&wo=" + encodeURIComponent(woNumber || "") +
    "&companyId=" + encodeURIComponent(companyId || ACTIVE_COMPANY_ID) +
    ownerPortalParam() +
    "&returnTo=" + encodeURIComponent(getOrdersReturnUrl(companyId || ACTIVE_COMPANY_ID));
}

function openSpecialInvoice(row, woNumber, companyId) {
  companyId = String(companyId || ACTIVE_COMPANY_ID || "").trim().toUpperCase();

  if (!row || !woNumber) {
    alert("No se pudo identificar la orden para el invoice especial.");
    return;
  }

  TOP_NAV.href =
    BASE_URL +
    "?view=close" +
    "&row=" + encodeURIComponent(row) +
    "&wo=" + encodeURIComponent(woNumber || "") +
    "&companyId=" + encodeURIComponent(companyId) +
    ownerPortalParam() +
    "&specialInvoice=1" +
    "&returnTo=" + encodeURIComponent(getOrdersReturnUrl(companyId));
}

function getOrdersReturnUrl(companyId) {
  let url = BASE_URL + "?view=orders";

  if (companyId) {
    url += "&companyId=" + encodeURIComponent(companyId);
  }

  url += ownerPortalParam();

  return url;
}

function ownerPortalParam() {
  return OWNER_PORTAL ? "&ownerOnly=1" : "";
}

function updateHeaderCompany(companyId) {
  companyId = String(companyId || "").toUpperCase();

  if (!companyId) {
    document.getElementById("companyTitle").innerText = "Company: Loading...";
    return;
  }

  google.script.run
    .withSuccessHandler(function(name) {
      document.getElementById("companyTitle").innerText =
        "Company: " + (name || companyId);
    })
    .withFailureHandler(function() {
      document.getElementById("companyTitle").innerText =
        "Company: " + companyId;
    })
    .getCompanyName(companyId);
}

function newOrder() {
  if (!ACTIVE_COMPANY_ID) {
    alert("Primero seleccione una empresa.");
    return;
  }

  TOP_NAV.href =
    BASE_URL +
    "?view=createOrder&companyId=" + encodeURIComponent(ACTIVE_COMPANY_ID) +
    ownerPortalParam() +
    "&returnTo=" + encodeURIComponent(getOrdersReturnUrl(ACTIVE_COMPANY_ID));
}

function load() {
  const user = getCurrentUser();
  const role = normalizeRole(user.role || user.ROLE);

  if (role === "OWNER") {
    loadCompanySelector(!!ACTIVE_COMPANY_ID);

    if (!ACTIVE_COMPANY_ID) {
      return;
    }
  } else if (!ACTIVE_COMPANY_ID) {
    ACTIVE_COMPANY_ID = String(user.companyId || "").toUpperCase();
  }

  updateHeaderCompany(ACTIVE_COMPANY_ID);

  document.getElementById("cards").innerHTML = "Loading...";

  google.script.run
    .withSuccessHandler(function(res) {
      data = res || [];
      ORDERS_RENDER_LIMIT = 80;
      ORDERS_FILTER_KEY = "";
      render();

      setTimeout(function() {
        showLastWOMessage();
        scrollToLastWO();
      }, 300);

      loadNotifications();
    })
    .withFailureHandler(function(err) {
      renderServerError(err, "cards", "ERROR loading dashboard: ");
    })
    .getDashboardData(ACTIVE_COMPANY_ID, user.role || user.ROLE, getSessionToken());
}

function loadCompanySelector(keepCurrentCards) {
  const user = getCurrentUser();

  if (!ACTIVE_COMPANY_ID) {
    document.getElementById("companyTitle").innerText = "Company: Seleccione empresa";
  }

  google.script.run
    .withSuccessHandler(function(companies) {
      renderCompanySelector(companies || [], keepCurrentCards);
    })
    .withFailureHandler(function(err) {
      renderServerError(err, "cards", "ERROR companies: ");
    })
    .getCompaniesForUser(user.companyId, user.role || user.ROLE, getSessionToken());
}

function renderCompanySelector(companies, keepCurrentCards) {
  const box = document.getElementById("companyBox");
  box.style.display = "block";

  if (!companies.length) {
    box.innerHTML = "<b>No hay empresas disponibles.</b>";
    return;
  }

  box.innerHTML = `
    <h3>Seleccionar Empresa</h3>
    <select id="companySelect">
      ${companies.map(function(c) {
        return `
          <option value="${c.COMPANY_ID}">
            ${c.COMPANY_ID} - ${c.COMPANY_NAME || ""}
          </option>
        `;
      }).join("")}
    </select>
    <button onclick="activateCompany()">Activar Empresa</button>
  `;

  if (ACTIVE_COMPANY_ID) {
    const select = document.getElementById("companySelect");
    if (select) select.value = ACTIVE_COMPANY_ID;
  }

  if (keepCurrentCards) return;

  document.getElementById("cards").innerHTML =
    "Seleccione una empresa para ver sus órdenes.";
}

function activateCompany() {
  ACTIVE_COMPANY_ID = document.getElementById("companySelect").value;

  if (!ACTIVE_COMPANY_ID) {
    alert("Seleccione una empresa.");
    return;
  }

  updateHeaderCompany(ACTIVE_COMPANY_ID);
  load();
}

function loadNotifications() {
  if (!ACTIVE_COMPANY_ID) return;

  google.script.run
    .withSuccessHandler(function(res) {
      const notifications = res || [];
      const unread = notifications.filter(function(n) {
        return String(n.READ || "").toUpperCase() !== "YES";
      }).length;

      document.getElementById("notifCount").innerText = unread ? unread : "";

      document.getElementById("notificationsBox").innerHTML =
        notifications.length
          ? notifications.map(function(n) {
              return `
                <div class="notif-item">
                  <b>${n.TYPE || ""}</b> — ${n.MESSAGE || ""}
                  <br>
                  <small>WO: ${n.WO_NUMBER || ""} | ${n.TIMESTAMP || ""}</small>
                </div>
              `;
            }).join("")
          : "No notifications.";
    })
    .withFailureHandler(function(err) {
      renderServerError(err, "notificationsBox", "ERROR loading notifications: ");
    })
    .getNotifications(ACTIVE_COMPANY_ID, getCurrentRole(), getSessionToken());
}

function toggleNotifications() {
  const box = document.getElementById("notificationsBox");

  if (box.style.display === "none" || box.style.display === "") {
    box.style.display = "block";

    loadNotifications();

    google.script.run
      .withSuccessHandler(loadNotifications)
      .withFailureHandler(function(err) {
        alertServerError(err);
      })
      .markNotificationsRead(ACTIVE_COMPANY_ID, getSessionToken());

  } else {
    box.style.display = "none";
  }
}

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const statusFilter = document.getElementById("statusFilter").value;
  const nsnFilter = document.getElementById("filterNSN").value.toLowerCase();
  const techFilter = document.getElementById("filterTech").value;
  const priorityFilter = document.getElementById("filterPriority").value;
  const filterKey = [search, statusFilter, nsnFilter, techFilter, priorityFilter].join("|");

  if (filterKey !== ORDERS_FILTER_KEY) {
    ORDERS_RENDER_LIMIT = 80;
    ORDERS_FILTER_KEY = filterKey;
  }

  const filtered = data.filter(function(o) {
    const text = JSON.stringify(o).toLowerCase();

    return (
      (!search || text.includes(search)) &&
      statusMatchesFilter(o.STATUS, statusFilter) &&
      (!nsnFilter || String(o.NSN || "").toLowerCase().includes(nsnFilter)) &&
      (!techFilter || String(o.TECHNICIAN || "").includes(techFilter)) &&
      (!priorityFilter || String(o.ORDER_PRIORITY || "").toUpperCase() === priorityFilter.toUpperCase())
    );
  });

  renderStatusMetrics(filtered);

  const visible = filtered.slice(0, ORDERS_RENDER_LIMIT);
  const moreHtml = filtered.length > visible.length
    ? `
      <div style="grid-column:1/-1; text-align:center; padding:16px;">
        <button onclick="loadMoreOrders()" style="background:#111827; color:white; padding:12px 18px; border-radius:10px; border:0; font-weight:bold;">
          Cargar mas (${visible.length} de ${filtered.length})
        </button>
      </div>
    `
    : "";

  document.getElementById("cards").innerHTML =
    visible.length ? visible.map(function(o) { return card(o); }).join("") + moreHtml : "No work orders found.";
}

function loadMoreOrders() {
  ORDERS_RENDER_LIMIT += ORDERS_RENDER_STEP;
  render();
}

function statusMatchesFilter(status, filterValue) {
  const normalizedStatus = String(status || "").trim().toUpperCase();
  const normalizedFilter = String(filterValue || "").trim().toUpperCase();

  if (!normalizedFilter) return true;

  if (normalizedFilter === "__NOT_COMPLETED__") {
    return normalizedStatus !== "COMPLETED" &&
      normalizedStatus !== "CLOSED" &&
      normalizedStatus !== "DELETED";
  }

  return normalizedStatus === normalizedFilter;
}

function getCreatedAgeText(o) {
  const rawDate = o.DATE_CREATED || "";

  if (!rawDate) return "Sin fecha";

  const createdDate = new Date(rawDate);

  if (isNaN(createdDate.getTime())) {
    return "Fecha inválida";
  }

  const now = new Date();
  const diffMs = now - createdDate;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (diffDays <= 0) return "Hoy";
  if (diffDays === 1) return "1 día";
  return diffDays + " días";
}

function getBtnClass(currentStatus, targetStatus) {
  const flow = [
    "ORDER RECEIVED",
    "SENT TO TECH",
    "IN PROGRESS",
    "REQUEST PARTS",
    "PARTS IN TRANSIT",
    "PARTS IN STORE",
    "READY FOR BILLING",
    "COMPLETED",
    "CLOSED"
  ];

  const currentIndex = flow.indexOf(String(currentStatus || "").toUpperCase());
  const targetIndex = flow.indexOf(targetStatus);

  if (currentIndex >= targetIndex && targetIndex !== -1) {
    return "btn-green";
  }

  return "btn-red";
}

function card(o) {
  let cls = "normal";
  const p = String(o.ORDER_PRIORITY || "").toLowerCase();

  if (p.includes("urgent") || p.includes("urgente")) cls = "urgent";
  if (p.includes("emergency") || p.includes("emergencia")) cls = "emergency";

  const row = Number(o.ROW_NUMBER);
  const equipment = o.REPORTED_EQUIPMENT || o["Reported Equipment"] || o["REPORTED EQUIPMENT"] || "No especificado";
  const woNumber = String(o.WO_NUMBER || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  const companyId = String(o.COMPANY_ID || ACTIVE_COMPANY_ID || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  const hasAttachmentFiles = !!String(o.FOLDER_URL || "").trim() || Number(o.ATTACHMENT_COUNT || 0) > 0;

  const currentTechs = String(o.TECHNICIAN || "")
    .split(",")
    .map(function(t) { return t.trim(); })
    .filter(Boolean);

  function checked(name) {
    return currentTechs.includes(name) ? "checked" : "";
  }

  const age = getCreatedAgeText(o);

  return `
    <div class="card ${cls}" id="wo_${o.WO_NUMBER}">
      <div class="card-top">
        <div>
          <b>${o.WO_NUMBER || ""}</b> | NSN ${o.NSN || ""}<br>
          <div class="status">${o.STATUS || ""}</div>
        </div>

        <div class="age-badge">
          ${age}
        </div>
      </div>

      <div><b>Company:</b> ${o.COMPANY_ID || ""}</div>
      <div><b>Técnico:</b> ${o.TECHNICIAN || "Sin asignar"}</div>
      <div><b>Dirección:</b> ${o.STORE_ADDRESS || "No disponible"}</div>
      <div><b>Equipo:</b> ${equipment}</div>
      <div><b>Prioridad:</b> ${o.ORDER_PRIORITY || ""}</div>

      <div><b>Problema:</b><br>${o.REPORTED_PROBLEM_ES || o.REPORTED_PROBLEM_ORIGINAL || ""}</div>
      ${renderTechnicianAssessment(o)}
      ${hasAttachmentFiles ? `
        <div><b>Archivos:</b> ${Number(o.ATTACHMENT_COUNT || 0)} foto(s)/video(s)</div>
      ` : ""}

      <textarea id="note_${row}" placeholder="Notas internas">${o.NOTES || ""}</textarea>

      <div class="tech-box" id="techbox_${row}">
        <label><input type="checkbox" value="David Dominguez" ${checked("David Dominguez")}> David Dominguez</label>
        <label><input type="checkbox" value="Miguel Rodriguez" ${checked("Miguel Rodriguez")}> Miguel Rodriguez</label>
        <label><input type="checkbox" value="Osnier Huerta" ${checked("Osnier Huerta")}> Osnier Huerta</label>
        <label><input type="checkbox" value="Alain Mora" ${checked("Alain Mora")}> Alain Mora</label>
      </div>

      <div class="actions">
        <button onclick="assignAndSend(${row})">Asignar</button>
        <button onclick="sendWO(${row})">Reenviar</button>
      </div>

      <div class="actions">
        <button class="${getBtnClass(o.STATUS,'IN PROGRESS')}" onclick="setStatus(${row},'IN PROGRESS')">En Proceso</button>
        <button class="${getBtnClass(o.STATUS,'REQUEST PARTS')}" onclick="setStatus(${row},'REQUEST PARTS')">Pedir Piezas</button>
        <button class="${getBtnClass(o.STATUS,'PARTS IN TRANSIT')}" onclick="setStatus(${row},'PARTS IN TRANSIT')">Piezas en Envío</button>
        <button class="${getBtnClass(o.STATUS,'PARTS IN STORE')}" onclick="setStatus(${row},'PARTS IN STORE')">Piezas en Store</button>
        <button class="${getBtnClass(o.STATUS,'COMPLETED')}" onclick="setStatus(${row},'COMPLETED')">Completado</button>
        <button class="${getBtnClass(o.STATUS,'CLOSED')}" onclick="setStatus(${row},'CLOSED')">Cerrar</button>
      </div>

      <div class="actions">
        <button onclick="saveNotes(${row})">Guardar Notas</button>

        ${hasAttachmentFiles ? `
          <button
            style="background:#2563eb;color:white;font-weight:bold;"
            onclick="openOrderAttachmentGallery(${row}, '${woNumber}', '${companyId}')">
            Fotos / Videos
          </button>
        ` : ""}

        ${canCreateSpecialInvoice() && !isPMOrderCard(o) ? `
          <button
            class="btn-special"
            onclick="openSpecialInvoice(${row}, '${woNumber}', '${companyId}')">
            Invoice Especial
          </button>
        ` : ""}

        ${canCreateQuote() ? `
  <button
    style="background:${String(o.QUOTE_STATUS || "").toUpperCase() === "APPROVED" ? "#16a34a" : "#2563eb"};color:white;font-weight:bold;"
    onclick="openQuote(${row}, '${o.WO_NUMBER || ""}', '${o.COMPANY_ID || ""}')">
    ${String(o.QUOTE_STATUS || "").toUpperCase() === "APPROVED" ? "QUOTE APPROVED" : "QUOTE"}
  </button>
` : ""}

        ${canDeleteWO() ? `
          <button
            style="background:#dc2626;color:white;font-weight:bold;"
            onclick="deleteWO(${row}, '${o.WO_NUMBER || ""}')">
            ELIMINAR
          </button>
        ` : ""}
      </div>
    </div>
  `;
}

function renderTechnicianAssessment(o) {
  o = o || {};
  const problemFound = String(o.TECH_PROBLEM_FOUND || "").trim();
  const proposedSolution = String(o.TECH_PROPOSED_SOLUTION || "").trim();
  const startedAt = String(o.DATE_WORK_STARTED || "").trim();
  const startedBy = String(o.WORK_STARTED_BY || "").trim();
  const row = Number(o.ROW_NUMBER || 0);

  if (!problemFound && !proposedSolution) return "";

  return `
    <button
      type="button"
      class="tech-assessment-toggle"
      aria-expanded="false"
      onclick="toggleTechnicianAssessment(${row}, this)">
      Ver diagnostico del tecnico
    </button>
    <div id="technicianAssessment_${row}" class="tech-assessment">
      <div class="tech-assessment-row"><b>Problema encontrado por el tecnico:</b><br>${escapeHtmlClient(problemFound)}</div>
      <div class="tech-assessment-row"><b>Solucion propuesta:</b><br>${escapeHtmlClient(proposedSolution)}</div>
      ${(startedAt || startedBy) ? `<div class="tech-assessment-row"><b>Inicio del trabajo:</b> ${escapeHtmlClient(startedAt)}${startedBy ? " por " + escapeHtmlClient(startedBy) : ""}</div>` : ""}
    </div>
  `;
}

function toggleTechnicianAssessment(row, button) {
  const detail = document.getElementById("technicianAssessment_" + Number(row));
  if (!detail) return;

  const isOpen = detail.classList.toggle("visible");
  if (button) {
    button.innerText = isOpen ? "Ocultar diagnostico del tecnico" : "Ver diagnostico del tecnico";
    button.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }
}

function openOrderAttachmentGallery(row, woNumber, companyId) {
  companyId = String(companyId || ACTIVE_COMPANY_ID || "").trim().toUpperCase();

  TOP_NAV.href =
    BASE_URL +
    "?view=orderFiles" +
    "&row=" + encodeURIComponent(row) +
    "&wo=" + encodeURIComponent(woNumber || "") +
    "&companyId=" + encodeURIComponent(companyId) +
    ownerPortalParam() +
    "&returnTo=" + encodeURIComponent(getOrdersReturnUrl(companyId));
}

function getSelectedTechs(row) {
  const box = document.getElementById("techbox_" + row);
  const checks = box.querySelectorAll("input[type=checkbox]:checked");

  return Array.from(checks)
    .map(function(c) { return c.value; })
    .filter(Boolean);
}

function assignAndSend(row) {
  const techs = getSelectedTechs(row);

  if (!techs.length) {
    return alert("Seleccione al menos un técnico.");
  }

  const techText = techs.join(", ");

  google.script.run
    .withSuccessHandler(function() {
      google.script.run
        .withSuccessHandler(function() {
          alert("Asignado y enviado correctamente.");
          load();
        })
        .withFailureHandler(function(err) {
          alertServerError(err);
        })
        .sendWorkOrderFromDashboard(row, getSessionToken());
    })
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .updateWorkOrderFromDashboard(row, { TECHNICIAN: techText }, getSessionToken());
}

function sendWO(row) {
  if (!confirm("¿Reenviar esta orden al técnico?")) return;

  google.script.run
    .withSuccessHandler(function() {
      alert("Orden enviada.");
      load();
    })
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .sendWorkOrderFromDashboard(row, getSessionToken());
}

function setStatus(row, st) {
  google.script.run
    .withSuccessHandler(function() {
      load();
    })
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .updateWorkOrderFromDashboard(row, { STATUS: st }, getSessionToken());
}

function saveNotes(row) {
  const notes = document.getElementById("note_" + row).value;

  google.script.run
    .withSuccessHandler(load)
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .updateWorkOrderFromDashboard(row, { NOTES: notes }, getSessionToken());
}

function deleteWO(row, woNumber) {
  if (!confirm("¿Seguro que deseas eliminar la orden " + woNumber + "?")) return;
  if (!confirm("Esta acción eliminará la fila completa del Sheet WORK_ORDERS. ¿Confirmas?")) return;

  google.script.run
    .withSuccessHandler(function() {
      alert("Orden eliminada correctamente.");
      load();
    })
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .deleteWorkOrder(row, getSessionToken());
}

function scrollToLastWO() {
  const lastWO = getAppSessionItem("lastWO");

  if (!lastWO) return;

  const el = document.getElementById("wo_" + lastWO);

  if (el) {
    el.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    removeAppSessionItem("lastWO");
  }
}

function showLastWOMessage() {
  const msg = getAppSessionItem("lastWOMessage");

  if (msg) {
    alert(msg);
    removeAppSessionItem("lastWOMessage");
  }
}

function renderStatusMetrics(list) {
  const statuses = [
    "ORDER RECEIVED",
    "SENT TO TECH",
    "IN PROGRESS",
    "REQUEST PARTS",
    "PARTS IN TRANSIT",
    "PARTS IN STORE",
    "READY FOR BILLING",
    "COMPLETED",
    "CLOSED"
  ];

  const counts = {};
  statuses.forEach(s => counts[s] = 0);

  list.forEach(function(o) {
    const st = String(o.STATUS || "").toUpperCase();
    if (counts[st] !== undefined) counts[st]++;
  });

  document.getElementById("statusMetrics").innerHTML =
    statuses.map(function(s) {
      return `
        <div style="background:white; padding:10px 14px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
          <b>${s}</b><br>
          <span style="font-size:22px; font-weight:bold;">${counts[s]}</span>
        </div>
      `;
    }).join("");
}

function openPartsTown() {
  window.open("https://www.partstown.com/", "_blank");
}

function escapeHtmlClient(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatMoneyClient(value) {
  const n = Number(value || 0);
  return "$" + n.toFixed(2);
}

function openFilterOrderModal() {
  if (!ACTIVE_COMPANY_ID) {
    alert("Seleccione una empresa antes de crear el pedido de filtros.");
    return;
  }

  document.getElementById("filterOrderRows").innerHTML =
    FILTER_ORDER_CATALOG.map(function(item, idx) {
      return `
        <div class="filter-order-grid filter-order-row">
          <div>
            <b>${escapeHtmlClient(item.size)}</b><br>
            <span class="muted">${escapeHtmlClient(item.sku)}</span>
          </div>
          <div>${escapeHtmlClient(item.description)}</div>
          <div>${formatMoneyClient(item.price)}</div>
          <div>
            <input id="filterQty_${idx}" type="number" min="0" step="1" value="0">
          </div>
        </div>
      `;
    }).join("");

  document.getElementById("filterOrderNotes").value = "";
  document.getElementById("filterOrderModal").style.display = "flex";
}

function closeFilterOrderModal() {
  document.getElementById("filterOrderModal").style.display = "none";
}

function submitFilterOrder() {
  const items = FILTER_ORDER_CATALOG.map(function(item, idx) {
    const qty = Number(document.getElementById("filterQty_" + idx).value || 0);
    return {
      sku: item.sku,
      qty: Math.max(0, Math.floor(qty))
    };
  }).filter(function(item) {
    return item.qty > 0;
  });

  if (!items.length) {
    alert("Ponga cantidad al menos en un filtro.");
    return;
  }

  const btn = document.getElementById("filterOrderSubmitBtn");
  btn.disabled = true;
  btn.innerText = "Generando...";

  const user = getCurrentUser();
  const payload = {
    companyId: ACTIVE_COMPANY_ID,
    requestedBy: user.name || user.NAME || user.email || user.EMAIL || "",
    notes: document.getElementById("filterOrderNotes").value,
    items: items
  };

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerText = "Generar PDF";
      closeFilterOrderModal();

      if (res && res.url) {
        alert("Pedido de filtros creado en Drive: " + (res.name || ""));
        window.open(res.url, "_blank");
      } else {
        alert("Pedido de filtros creado.");
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerText = "Generar PDF";
      alertServerError(err);
    })
    .createFilterOrderPdf(payload, getSessionToken());
}

load();

window.addEventListener("pageshow", function() {
  load();
});
</script>

</body>
</html>
