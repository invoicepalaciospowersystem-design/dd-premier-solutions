<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; background:#f3f4f6; margin:0; padding:15px; color:#111827; }

    .header, .box {
      background:white;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .card-top {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .age-badge {
      background:#111827;
      color:white;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      white-space:nowrap;
    }

    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;

      gap:10px;

      border:1px solid #bfdbfe;
      border-left:6px solid #2563eb;
      border-radius:12px;
      padding:14px 16px;
      margin-bottom:15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .supplier-account-title {
      color:#1e3a8a;
      font-size:16px;
      font-weight:bold;
      margin-bottom:4px;
    }

    .supplier-account-note {
      color:#475569;
      font-size:13px;
    }

    .supplier-account-number {
      min-width:148px;
      padding:10px 14px;
      border-radius:9px;
      background:#ffffff;

      font-size:24px;
      font-weight:bold;
      text-align:center;
      letter-spacing:0;

    button {

      border-radius:10px;

      font-weight:bold;

      background:#111827;

    .notif { background:#2563eb; }
    .btn { background:#dc2626; }
    .active { background:#16a34a !important; }

    button:disabled {
      opacity:1;
      cursor:not-allowed;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
      gap:15px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      border-left:6px solid #16a34a;
    }

    .urgent { border-left-color:orange; }
    .emergency { border-left-color:red; }
    .normal { border-left-color:green; }

    .status {
      display:inline-block;
      padding:5px 10px;
      background:#e5e7eb;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      margin:8px 0;
    }

    .small {
      font-size:14px;
      margin:6px 0;
    }

    .map-address {
      display:inline-block;
      margin-right:8px;
    }

    .map-control {
      display:inline-block;
      position:relative;
      margin-top:6px;
    }

    .map-button {
      width:auto;
      padding:6px 10px;
      border-radius:8px;
      background:#2563eb;
      font-size:12px;
      line-height:1;
    }

    .map-menu {
      display:none;
      position:absolute;
      z-index:20;
      left:0;
      top:calc(100% + 6px);
      min-width:150px;
      background:#ffffff;
      border:1px solid #d1d5db;
      border-radius:10px;
      box-shadow:0 10px 24px rgba(15,23,42,.18);
      overflow:hidden;
    }

    .map-menu.open {
      display:block;
    }

    .map-menu a {
      display:block;
      padding:10px 12px;
      color:#111827;
      font-size:13px;
      font-weight:bold;
      text-decoration:none;
      white-space:nowrap;
    }

    .map-menu a:hover {
      background:#eff6ff;
      color:#1d4ed8;
    }

    .tech-metric-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:10px;
      margin:12px 0;
    }

    .tech-metric {
      text-align:left;
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-left:5px solid #2563eb;
      border-radius:12px;
      padding:12px;
      color:#111827;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      cursor:pointer;
    }

    .tech-metric:hover {
      transform:translateY(-1px);
      box-shadow:0 6px 16px rgba(0,0,0,.12);
    }

    .tech-metric.success { border-left-color:#16a34a; }
    .tech-metric.warning { border-left-color:#f59e0b; }
    .tech-metric.danger { border-left-color:#dc2626; }
    .tech-metric.neutral { border-left-color:#64748b; }

    .tech-metric-label {
      color:#64748b;
      font-size:12px;
      font-weight:bold;
      text-transform:uppercase;
    }

    .tech-metric-value {
      font-size:26px;
      font-weight:bold;
      margin-top:5px;
    }

    .tech-metric-note {
      color:#64748b;
      font-size:12px;
      margin-top:4px;
    }

    .problem {
      background:#f9fafb;
      padding:10px;
      border-radius:10px;
      margin-top:8px;
      font-size:14px;
    }

    .actions {
      margin-top:10px;
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .actions button {
      width:auto;
      flex:1;
      min-width:145px;
    }

    #notifCount {
      background:red;
      color:white;
      padding:3px 8px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    #notificationsBox {
      display:none;
      background:white;
      padding:12px;
      border-radius:12px;
      margin-bottom:15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .notif-item {
      padding:8px;
      border-bottom:1px solid #e5e7eb;
      font-size:14px;
    }

    table th, table td {
      vertical-align:top;
    }

    @media (max-width:420px) {
      .grid { grid-template-columns:1fr; }
      .supplier-account-banner {
        align-items:flex-start;
        flex-direction:column;
      }
      .supplier-account-number {
        width:100%;
        box-sizing:border-box;
      }
    }
  </style>
  <?!= include("AppWatermark"); ?>
</head>

<div id="orders" class="grid">Cargando...</div>

<script>
function navigateApp(url) {
  const target = String(url || "").trim();
  if (!target) return;

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "PPS_NAVIGATE", url: target }, "*");
      setTimeout(function() {
        try {
          window.open(target, "_top");
        } catch (err) {
          window.location.href = target;
        }
      }, 250);
      return;
    }
  } catch (err) {}

  try {
    window.open(target, "_top");
  } catch (err) {
    window.location.href = target;
  }
}

const TOP_NAV = {
  set href(url) {
    navigateApp(url);
  }
};

function requireLogin() {
  const user = localStorage.getItem("pps_user");

  if (!user) {
    TOP_NAV.href = "<?= baseUrl ?>";
    return false;
  }

  try {
    const parsed = JSON.parse(user);
    if ((!parsed.role && !parsed.ROLE) || (!parsed.sessionToken && !parsed.SESSION_TOKEN)) {
      localStorage.removeItem("pps_user");
      TOP_NAV.href = "<?= baseUrl ?>";
      return false;
    }
  } catch (e) {
    localStorage.removeItem("pps_user");
    TOP_NAV.href = "<?= baseUrl ?>";
    return false;
  }

  return true;
}

if (!requireLogin()) {
  throw new Error("No autorizado");
}

const TECH_NAME = "<?= techName ?>";
const BASE_URL = "<?= baseUrl ?>";
const UNITED_REFRIGERATION_ACCOUNT =
  String("<?= unitedRefrigerationAccount ?>").trim() || "11437479";

let ACTIVE_TECH_ORDERS = [];
let CURRENT_TECH_MONTHLY_SUMMARY = null;
let CURRENT_TECH_INVOICE_SUMMARY = null;

function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem("pps_user") || "{}");
  } catch (e) {
    return {};
  }
}

function getCurrentCompanyId() {
  const user = getCurrentUser();
  return String(user.companyId || "").toUpperCase();
}

function getSessionToken() {
  const user = getCurrentUser();
  return user.sessionToken || user.SESSION_TOKEN || "";
}

function loadSupplierAccountBanner() {
  const banner = document.getElementById("supplierAccountBanner");
  const numberBox = document.getElementById("unitedAccountNumber");
  if (!banner || !numberBox) return;

  if (!UNITED_REFRIGERATION_ACCOUNT) {
    banner.style.display = "none";
    return;
  }

  numberBox.innerText = UNITED_REFRIGERATION_ACCOUNT;
  banner.style.display = "flex";
}

function loadHeader() {
  const companyId = getCurrentCompanyId();

  google.script.run
    .withSuccessHandler(function(name) {
      document.getElementById("companyTitle").innerText =
        "Company: " + (name || companyId);
    })
    .withFailureHandler(function() {
      document.getElementById("companyTitle").innerText =
        "Company: " + companyId;
    })
    .getCompanyName(companyId);
}

function loadOrders() {
  if (!TECH_NAME) {
    document.getElementById("orders").innerHTML = "No se recibió el técnico.";
    return;
  }

  document.getElementById("orders").innerHTML = "Cargando...";

  google.script.run
    .withSuccessHandler(function(data) {
      renderOrders(data || []);
    })
    .withFailureHandler(function(err) {
      document.getElementById("orders").innerHTML = "ERROR: " + err.message;
    })
    .getTechnicianOrders(TECH_NAME, getSessionToken(), getCurrentCompanyId());
}

function renderOrders(data) {
  ACTIVE_TECH_ORDERS = data || [];

  if (!data.length) {
    document.getElementById("orders").innerHTML = "No hay órdenes activas.";
    renderTechStatusMetrics([]);
    renderTechDashboardMetrics();
    return;
  }

  renderTechStatusMetrics(data);
  renderTechDashboardMetrics();
  document.getElementById("orders").innerHTML = data.map(card).join("");
}

function getAssignedAgeText(o) {
  const rawDate = o.DATE_SENT_TO_TECH || o.EMAIL_SENT_DATE || o.DATE_CREATED || "";

  if (!rawDate) return "Sin fecha";

  const assignedDate = new Date(rawDate);

  if (isNaN(assignedDate.getTime())) {
    return "Fecha inválida";
  }

  const now = new Date();
  const diffMs = now - assignedDate;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (diffDays <= 0) return "Hoy";
  if (diffDays === 1) return "1 día";
  return diffDays + " días";
}

function card(o) {
  const status = String(o.STATUS || "").toUpperCase();
  const priority = String(o.ORDER_PRIORITY || "").toLowerCase();

  let cls = "normal";
  if (priority.includes("urgent") || priority.includes("urgente")) cls = "urgent";
  if (priority.includes("emergency") || priority.includes("emergencia")) cls = "emergency";

  function isActive(s) {
    const order = [
      "SENT TO TECH",
      "IN PROGRESS",
      "REQUEST PARTS",
      "PARTS IN TRANSIT",
      "PARTS IN STORE",
      "COMPLETED"
    ];

    const currentIndex = order.indexOf(status);
    const targetIndex = order.indexOf(s);

    if (currentIndex === -1 || targetIndex === -1) return "";
    return currentIndex >= targetIndex ? "active" : "";
  }

  const row = Number(o.ROW_NUMBER);
  const equipment = o.REPORTED_EQUIPMENT || o.REPORTED_EQUIPMENT_EN || o["REPORTED EQUIPMENT"] || "No especificado";
  const problem = o.REPORTED_PROBLEM_ES || o.REPORTED_PROBLEM_EN || o.REPORTED_PROBLEM_ORIGINAL || "";
  const address = o.STORE_ADDRESS || "No disponible";

  const assignedAge = getAssignedAgeText(o);

  return `
    <div class="card ${cls}" id="wo_${o.WO_NUMBER || ""}">
      <div class="card-top">
        <div>
          <b>${o.WO_NUMBER || ""}</b> | NSN ${o.NSN || ""}<br>
          <div class="status">${o.STATUS || ""}</div>
        </div>

        <div class="age-badge">
          ${assignedAge} asignada
        </div>
      </div>

      <div class="small"><b>Company:</b> ${o.COMPANY_ID || ""}</div>
      <div class="small"><b>Técnico:</b> ${o.TECHNICIAN || TECH_NAME}</div>
      <div class="small"><b>Dirección:</b> ${renderAddressMapControl(address, row)}</div>
      <div class="small"><b>Equipo:</b> ${equipment}</div>
      <div class="small"><b>Prioridad:</b> ${o.ORDER_PRIORITY || ""}</div>

      <div class="problem">
        <b>Problema:</b><br>${problem}
      </div>

      <div class="actions">
        <button class="btn ${isActive('IN PROGRESS')}" onclick="updateStatus(${row}, 'IN PROGRESS')">
          Iniciar Trabajo
        </button>

        <button class="btn ${isActive('REQUEST PARTS')}" onclick="updateStatus(${row}, 'REQUEST PARTS')">
          Pedir Piezas
        </button>
      </div>

      <div class="actions">
        <button class="btn ${isActive('PARTS IN TRANSIT')}" disabled>
          Piezas en Envío
        </button>

        <button class="btn ${isActive('PARTS IN STORE')}" disabled>
          Piezas en Store
        </button>
      </div>

      <div class="actions">
  <button class="btn ${isActive('COMPLETED')}" onclick="openCloseOrder(${row}, '${o.WO_NUMBER || ""}')">
    Trabajo Completado
  </button>

  ${
    String(o.WO_TYPE || "")
      .toUpperCase()
      .includes("PM")
      ? `
        <button style="background:#7c3aed;" onclick="openPMReport(${row}, '${o.WO_NUMBER || ""}')">
          📋 Reporte PM
        </button>
      `
      : ""
  }
</div>
    </div>
  `;
}

function renderAddressMapControl(address, row) {
  address = String(address || "").trim();
  if (!address || address === "No disponible") return "No disponible";

  const menuId = "mapmenu_" + row;
  const googleUrl = buildGoogleMapsUrl(address);
  const appleUrl = buildAppleMapsUrl(address);

  return `
    <span class="map-address">${escapeHtmlTech(address)}</span>
    <span class="map-control">
      <button type="button" class="map-button" onclick="toggleMapMenu('${escapeHtmlTech(menuId)}', event)">Mapa</button>
      <span id="${escapeHtmlTech(menuId)}" class="map-menu">
        <a href="${escapeHtmlTech(googleUrl)}" target="_blank" rel="noopener noreferrer">Google Maps</a>
        <a href="${escapeHtmlTech(appleUrl)}" target="_blank" rel="noopener noreferrer">Apple Maps</a>
      </span>
    </span>
  `;
}

function buildGoogleMapsUrl(address) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
}

function buildAppleMapsUrl(address) {
  return "https://maps.apple.com/?q=" + encodeURIComponent(address);
}

function toggleMapMenu(menuId, event) {
  if (event && event.stopPropagation) event.stopPropagation();

  const menu = document.getElementById(menuId);
  if (!menu) return;

  const shouldOpen = !menu.classList.contains("open");
  closeMapMenus();
  if (shouldOpen) menu.classList.add("open");
}

function closeMapMenus() {
  document.querySelectorAll(".map-menu.open").forEach(function(menu) {
    menu.classList.remove("open");
  });
}

document.addEventListener("click", closeMapMenus);

function escapeHtmlTech(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function updateStatus(row, status) {
  google.script.run
    .withSuccessHandler(function() {
      loadOrders();
      loadNotifications();
    })
    .withFailureHandler(function(err) {
      alert(err.message);
    })
    .updateTechOrderStatus(row, status, getSessionToken());
}

function loadNotifications() {
  google.script.run
    .withSuccessHandler(function(res) {
      res = res || [];

      const unread = res.filter(function(n) {
        return String(n.READ || "").toUpperCase() !== "YES";
      }).length;

      document.getElementById("notifCount").innerText = unread || "";

      document.getElementById("notificationsBox").innerHTML =
        res.length
          ? res.map(function(n) {
              return `<div class="notif-item">${n.MESSAGE || ""}</div>`;
            }).join("")
          : "No hay notificaciones.";
    })
    .withFailureHandler(function(err) {
      document.getElementById("notificationsBox").innerHTML =
        "ERROR: " + err.message;
    })
    .getNotificationsByUser(TECH_NAME, getCurrentCompanyId(), getSessionToken());
}

function toggleNotifications() {
  const box = document.getElementById("notificationsBox");

  if (box.style.display === "none" || box.style.display === "") {
    box.style.display = "block";

    google.script.run
      .withSuccessHandler(loadNotifications)
      .withFailureHandler(function(err) {
        alert(err.message);
      })
      .markNotificationsReadByUser(TECH_NAME, getCurrentCompanyId(), getSessionToken());

  } else {
    box.style.display = "none";
  }
}

function openCloseOrder(row, woNumber) {
  TOP_NAV.href =
    BASE_URL + "?view=close&row=" + encodeURIComponent(row) +
    "&wo=" + encodeURIComponent(woNumber) +
    "&tech=" + encodeURIComponent(TECH_NAME) +
    "&returnTo=" + encodeURIComponent(getTechReturnUrl());
}

function showTechMessage() {
  const msg = localStorage.getItem("lastTechMessage");

  if (msg) {
    alert(msg);
    localStorage.removeItem("lastTechMessage");
  }
}

function openPMReport(row, woNumber) {
  TOP_NAV.href =
    BASE_URL + "?view=pm_report" +
    "&row=" + encodeURIComponent(row) +
    "&wo=" + encodeURIComponent(woNumber) +
    "&tech=" + encodeURIComponent(TECH_NAME) +
    "&returnTo=" + encodeURIComponent(getTechReturnUrl());
}

function getTechReturnUrl() {
  return BASE_URL + "?view=tech&tech=" + encodeURIComponent(TECH_NAME);
}

function initMySummaryDate() {
  const now = new Date();
  document.getElementById("mySummaryMonth").value = now.getMonth() + 1;
  document.getElementById("mySummaryYear").value = now.getFullYear();
}

function refreshMyTechDashboard() {
  loadMyTechSummary();
  loadMyTechDashboardInvoices();
}

function loadMyTechSummary() {
  const companyId = getCurrentCompanyId();
  const month = Number(document.getElementById("mySummaryMonth").value);
  const year = Number(document.getElementById("mySummaryYear").value);

  google.script.run
    .withSuccessHandler(function(r) {
      CURRENT_TECH_MONTHLY_SUMMARY = r || {};
      renderTechDashboardMetrics();
    })
    .withFailureHandler(function(err) {
      CURRENT_TECH_MONTHLY_SUMMARY = {};
      renderTechDashboardMetrics();
      console.warn("ERROR resumen tecnico:", err && err.message ? err.message : err);
    })
    .getMyTechMonthlySummary(companyId, TECH_NAME, month, year, getSessionToken());
}

function loadMyTechDashboardInvoices() {
  const companyId = getCurrentCompanyId();
  const month = Number(document.getElementById("mySummaryMonth").value);
  const year = Number(document.getElementById("mySummaryYear").value);

  google.script.run
    .withSuccessHandler(function(r) {
      CURRENT_TECH_INVOICE_SUMMARY = r || {};
      renderTechDashboardMetrics();
    })
    .withFailureHandler(function() {
      CURRENT_TECH_INVOICE_SUMMARY = { rows: [], totals: {} };
      renderTechDashboardMetrics();
    })
    .getMyTechInvoiceSummary(companyId, TECH_NAME, month, year, getSessionToken());
}

function renderMyTechSummary(r) {
  return;
  document.getElementById("myTechSummaryBox").innerHTML = `
    <div style="background:#f9fafb; padding:12px; border-radius:10px;">
      <div><b>Técnico:</b> ${r.name || TECH_NAME}</div>
      <div><b>Órdenes completadas:</b> ${r.orders || 0}</div>
      <div><b>Horas:</b> ${Number(r.hours || 0).toFixed(2)}</div>
      <div><b>Rate:</b> ${formatMoneyTech(r.rate || 0)}</div>
      <div><b>Pago por horas:</b> ${formatMoneyTech(r.laborPay || 0)}</div>
      <div><b>Materiales asignados:</b> ${formatMoneyTech(r.materialCost || 0)}</div>
      <div><b>10% materiales:</b> ${formatMoneyTech(r.materialBonus || 0)}</div>
      <hr>
      <div style="font-size:18px;"><b>Total estimado:</b> ${formatMoneyTech(r.totalPay || 0)}</div>
      <small>WO: ${(r.workOrders || []).join(", ") || "N/A"}</small>
    </div>
  `;
}

function loadMyTechInvoiceTable() {
  const companyId = getCurrentCompanyId();
  const month = Number(document.getElementById("mySummaryMonth").value);
  const year = Number(document.getElementById("mySummaryYear").value);

  document.getElementById("myTechInvoiceTableBox").innerHTML = "Cargando tabla...";

  google.script.run
    .withSuccessHandler(function(r) {
      CURRENT_TECH_INVOICE_SUMMARY = r || {};
      renderTechDashboardMetrics();
      renderMyTechInvoiceTable(r || {});
    })
    .withFailureHandler(function(err) {
      document.getElementById("myTechInvoiceTableBox").innerHTML =
        "ERROR tabla: " + err.message;
    })
    .getMyTechInvoiceSummary(companyId, TECH_NAME, month, year, getSessionToken());
}

function renderMyTechInvoiceTable(r) {
  const rows = r.rows || [];
  const totals = r.totals || {};

  if (!rows.length) {
    document.getElementById("myTechInvoiceTableBox").innerHTML =
      "<div style='background:#f9fafb; padding:12px; border-radius:10px;'>No invoices found for this period.</div>";
    return;
  }

  document.getElementById("myTechInvoiceTableBox").innerHTML = `
    <div style="background:#f9fafb; padding:12px; border-radius:10px; overflow:auto;">
      <h3>Invoice Detail</h3>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
        <div><b>Invoices:</b> ${totals.invoices || 0}</div>
        <div><b>Hours:</b> ${Number(totals.hours || 0).toFixed(2)}</div>
        <div><b>Labor Pay:</b> ${formatMoneyTech(totals.laborPay || 0)}</div>
        <div><b>Material 10%:</b> ${formatMoneyTech(totals.materialBonus || 0)}</div>
        <div><b>Total Earned:</b> ${formatMoneyTech(totals.totalEarned || 0)}</div>
      </div>

      <table style="width:100%; border-collapse:collapse; font-size:13px; min-width:1100px;">
        <thead>
          <tr style="background:#111827; color:white;">
            <th style="padding:8px; text-align:left;">WO #</th>
            <th style="padding:8px; text-align:left;">Invoice #</th>
            <th style="padding:8px; text-align:left;">Store #</th>
            <th style="padding:8px; text-align:left;">Equipment</th>
            <th style="padding:8px; text-align:left;">Problem</th>
            <th style="padding:8px; text-align:right;">Hours</th>
            <th style="padding:8px; text-align:right;">Labor Pay</th>
            <th style="padding:8px; text-align:right;">Material 10%</th>
            <th style="padding:8px; text-align:right;">Total Earned</th>
                      </tr>
        </thead>
        <tbody>
          ${rows.map(function(x) {
            return `
              <tr style="border-bottom:1px solid #e5e7eb;">
                <td style="padding:8px;">${x.woNumber || ""}</td>
                <td style="padding:8px;">${x.invoiceNumber || ""}</td>
                <td style="padding:8px;">${x.storeNumber || ""}</td>
                <td style="padding:8px;">${x.equipment || ""}</td>
                <td style="padding:8px; max-width:260px;">${x.problem || ""}</td>
                <td style="padding:8px; text-align:right;">${Number(x.hours || 0).toFixed(2)}</td>
                <td style="padding:8px; text-align:right;">${formatMoneyTech(x.laborPay || 0)}</td>
                <td style="padding:8px; text-align:right;">${formatMoneyTech(x.materialBonus || 0)}</td>
                <td style="padding:8px; text-align:right;"><b>${formatMoneyTech(x.totalEarned || 0)}</b></td>
                              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderTechDashboardMetrics() {
  const box = document.getElementById("techDashboardMetrics");
  if (!box) return;

  const activeOrders = ACTIVE_TECH_ORDERS || [];
  const monthly = CURRENT_TECH_MONTHLY_SUMMARY || {};
  const invoiceSummary = CURRENT_TECH_INVOICE_SUMMARY || {};
  const invoiceTotals = invoiceSummary.totals || {};

  const statusCounts = countTechStatuses(activeOrders);
  const partsWaiting =
    Number(statusCounts["REQUEST PARTS"] || 0) +
    Number(statusCounts["PARTS IN TRANSIT"] || 0) +
    Number(statusCounts["PARTS IN STORE"] || 0);

  const hours = Number(invoiceTotals.hours || monthly.hours || 0);
  const laborPay = Number(invoiceTotals.laborPay || monthly.laborPay || 0);
  const materialBonus = Number(invoiceTotals.materialBonus || monthly.materialBonus || 0);
  const totalEarned = Number(invoiceTotals.totalEarned || monthly.totalPay || 0);

  const cards = [
    {
      key: "orders",
      label: "Ordenes Activas",
      value: activeOrders.length,
      note: "Asignadas ahora",
      tone: activeOrders.length ? "info" : "success"
    },
    {
      key: "progress",
      label: "En Progreso",
      value: statusCounts["IN PROGRESS"] || 0,
      note: "Trabajos iniciados",
      tone: "info"
    },
    {
      key: "parts",
      label: "Esperando Piezas",
      value: partsWaiting,
      note: "Request / transit / store",
      tone: partsWaiting ? "warning" : "success"
    },
    {
      key: "completed",
      label: "Completadas",
      value: monthly.orders || 0,
      note: "Periodo seleccionado",
      tone: "success"
    },
    {
      key: "invoices",
      label: "Invoices",
      value: invoiceTotals.invoices || 0,
      note: "Con economia registrada",
      tone: "neutral"
    },
    {
      key: "hours",
      label: "Horas",
      value: hours.toFixed(2),
      note: "Horas del periodo",
      tone: "neutral"
    },
    {
      key: "labor",
      label: "Pago Horas",
      value: formatMoneyTech(laborPay),
      note: "Labor del tecnico",
      tone: "info"
    },
    {
      key: "materials",
      label: "10% Materiales",
      value: formatMoneyTech(materialBonus),
      note: "Bonus por parts",
      tone: "warning"
    },
    {
      key: "total",
      label: "Total Estimado",
      value: formatMoneyTech(totalEarned),
      note: "Labor + materiales",
      tone: "success"
    }
  ];

  box.innerHTML = cards.map(function(card) {
    return `
      <button type="button" class="tech-metric ${card.tone || "neutral"}" onclick="openTechMetric('${card.key}')">
        <div class="tech-metric-label">${card.label}</div>
        <div class="tech-metric-value">${card.value}</div>
        <div class="tech-metric-note">${card.note} | Ver detalle</div>
      </button>
    `;
  }).join("");
}

function countTechStatuses(list) {
  const counts = {};

  (list || []).forEach(function(o) {
    const status = String(o.STATUS || "").toUpperCase();
    counts[status] = (counts[status] || 0) + 1;
  });

  return counts;
}

function openTechMetric(key) {
  if (["orders", "progress", "parts"].indexOf(key) !== -1) {
    document.getElementById("orders").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (!document.getElementById("myTechInvoiceTableBox").innerHTML.trim()) {
    loadMyTechInvoiceTable();
  }

  document.getElementById("myTechInvoiceTableBox").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function renderTechStatusMetrics(list) {
  const statuses = [
    "SENT TO TECH",
    "IN PROGRESS",
    "REQUEST PARTS",
    "PARTS IN TRANSIT",
    "PARTS IN STORE"
  ];

  const counts = {};
  statuses.forEach(s => counts[s] = 0);

  list.forEach(function(o) {
    const st = String(o.STATUS || "").toUpperCase();
    if (counts[st] !== undefined) counts[st]++;
  });

  document.getElementById("techStatusMetrics").innerHTML =
    statuses.map(function(s) {
      return `
        <div style="background:white; padding:10px 14px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
          <b>${s}</b><br>
          <span style="font-size:22px; font-weight:bold;">${counts[s]}</span>
        </div>
      `;
    }).join("");
}

function formatMoneyTech(v) {
  return "$" + Number(v || 0).toFixed(2);
}

document.addEventListener("DOMContentLoaded", function() {
  loadSupplierAccountBanner();
  loadHeader();
  initMySummaryDate();
  loadMyTechSummary();
  loadMyTechDashboardInvoices();
  loadOrders();
  loadNotifications();
  showTechMessage();
});
</script>

</body>
