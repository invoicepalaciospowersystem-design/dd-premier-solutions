<script>
function navigateApp(url) {
  const target = String(url || "").trim();
  if (!target) return;

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "PPS_NAVIGATE", url: target }, "*");
      setTimeout(function() {
        try {
          window.open(target, "_top");
        } catch (err) {
          window.location.href = target;
        }
      }, 250);
      return;
    }
  } catch (err) {}

  try {
    window.open(target, "_top");
  } catch (err) {
    window.location.href = target;
  }
}

const TOP_NAV = {
  set href(url) {
    navigateApp(url);
  }
};

const BASE_URL = "<?= baseUrl ?>";
const COMPANY_ID_FROM_URL = String("<?= companyId ?>").trim().toUpperCase();
const OWNER_PORTAL = String("<?= ownerOnly ?>").trim().toLowerCase() === "true";
let ECONOMY = [];
let ACTIVE_COMPANY_ID = COMPANY_ID_FROM_URL || getSavedOwnerCompanyId();
let CURRENT_PERIOD_LABEL = "";
let VIEW_MODE = "REGULAR";
let ECONOMY_METRIC_FILTER = "all";
let METRIC_PERIOD_INITIALIZED = false;

function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem("pps_user") || "{}");
  } catch (e) {
    return {};
  }
}

function getSessionToken() {
  const user = getCurrentUser();
  return user.sessionToken || user.SESSION_TOKEN || "";
}

function getSavedOwnerCompanyId() {
  try {
    return String(localStorage.getItem("owner_selected_company_ALL") || "").trim().toUpperCase();
  } catch (err) {
    return "";
  }
}

function saveOwnerCompanyId(companyId) {
  companyId = String(companyId || "").trim().toUpperCase();
  if (!companyId) return;

  try {
    localStorage.setItem("owner_selected_company_ALL", companyId);
  } catch (err) {}
}

function getErrorMessage(err) {
  return String((err && err.message) || err || "Error desconocido");
}

function isSessionExpiredError(err) {
  const message = getErrorMessage(err).toLowerCase();
  return message.includes("sesion expirada") || message.includes("session expired");
}

function handleSessionFailure(err) {
  if (!isSessionExpiredError(err)) return false;
  localStorage.removeItem("pps_user");
  alert("Sesion expirada. Inicie sesion nuevamente.");
  TOP_NAV.href = OWNER_PORTAL ? BASE_URL + "?ownerOnly=1" : BASE_URL;
  return true;
}

function alertServerError(err) {
  if (handleSessionFailure(err)) return;
  alert(getErrorMessage(err));
}

function renderServerError(err, elementId, prefix) {
  if (handleSessionFailure(err)) return;
  document.getElementById(elementId).innerHTML = prefix + getErrorMessage(err);
}

function requireEconomyLogin() {
  const user = getCurrentUser();
  const role = String(user.role || user.ROLE || "").toUpperCase();
  const token = getSessionToken();
  const expiresAt = Number(user.sessionExpiresAt || user.SESSION_EXPIRES_AT || 0);

  if (!token || (expiresAt && expiresAt <= Date.now()) || ["OWNER", "ADMIN", "ECONOMIA"].indexOf(role) === -1) {
    localStorage.removeItem("pps_user");
    TOP_NAV.href = OWNER_PORTAL ? BASE_URL + "?ownerOnly=1" : BASE_URL;
    return false;
  }

  return true;
}

function setMode(mode) {
  VIEW_MODE = mode;
  ECONOMY_METRIC_FILTER = "all";

  document.getElementById("regularBtn").classList.toggle("mode-active", mode === "REGULAR");
  document.getElementById("pmBtn").classList.toggle("mode-active", mode === "PM");

  document.getElementById("syncInvoicesBtn").style.display = mode === "REGULAR" ? "inline-block" : "none";
  document.getElementById("syncOldBtn").style.display = mode === "REGULAR" ? "inline-block" : "none";

  load();
}

function updateHeaderCompany(companyId) {
  companyId = String(companyId || "").toUpperCase();

  if (!companyId) {
    document.getElementById("companyTitle").innerText = "Company: Loading...";
    return;
  }

  google.script.run
    .withSuccessHandler(function(name) {
      document.getElementById("companyTitle").innerText =
        "Company: " + (name || companyId) + (VIEW_MODE === "PM" ? " / PM Economy" : "");
    })
    .withFailureHandler(function() {
      document.getElementById("companyTitle").innerText =
        "Company: " + companyId + (VIEW_MODE === "PM" ? " / PM Economy" : "");
    })
    .getCompanyName(companyId);
}

function initSummaryDate() {
  const now = new Date();
  document.getElementById("summaryMonth").value = now.getMonth() + 1;
  document.getElementById("summaryYear").value = now.getFullYear();
  initMetricPeriodControls();
  syncTechSummaryPeriodControls();
}

function loadTechSummary() {
  if (!ACTIVE_COMPANY_ID) {
    alert("Primero cargue la compañía.");
    return;
  }

  const mode = String(document.getElementById("summaryMode").value || "monthly");
  const month = Number(document.getElementById("summaryMonth").value);
  const year = Number(document.getElementById("summaryYear").value);

  document.getElementById("techSummaryBox").style.display = "block";
  document.getElementById("techSummaryBox").innerHTML = "Cargando resumen técnicos...";

  google.script.run
    .withSuccessHandler(function(res) {
      renderTechSummary(res || [], mode, month, year);
    })
    .withFailureHandler(function(err) {
      document.getElementById("techSummaryBox").innerHTML =
        "ERROR resumen técnicos: " + err.message;
    })
    .getTechPeriodSummary(ACTIVE_COMPANY_ID, mode, month, year, getSessionToken());
}

function syncTechSummaryPeriodControls() {
  const mode = String(document.getElementById("summaryMode").value || "monthly");
  const month = document.getElementById("summaryMonth");

  if (month) month.style.display = mode === "monthly" ? "" : "none";
}

function renderTechSummary(rows, mode, month, year) {
  const label = String(mode || "monthly") === "annual"
    ? "Anual " + year
    : "Mensual " + year + "-" + String(month || "").padStart(2, "0");
  const noDataMessage = "<h3>Resumen Tecnicos - " + label + "</h3>No hay datos para este periodo.";

  if (!rows.length) {
    document.getElementById("techSummaryBox").innerHTML = noDataMessage;
    return;
  }
  if (!rows.length) {
    document.getElementById("techSummaryBox").innerHTML =
      "<h3>Resumen Técnicos</h3>No hay datos para este mes.";
    return;
  }

  document.getElementById("techSummaryBox").innerHTML = `
    <h3>Resumen Técnicos</h3>

    <div style="overflow:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead>
          <tr style="background:#f3f4f6;">
            <th style="padding:8px; border:1px solid #e5e7eb;">Técnico</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Órdenes</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Horas</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Rate</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Pago Horas</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Materiales</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">10% Materiales</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Total Pagar</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(function(r) {
            return `
              <tr>
                <td style="padding:8px; border:1px solid #e5e7eb;">
                  <b>${r.name || ""}</b><br>
                  <small>${(r.workOrders || []).join(", ")}</small>
                </td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:center;">${r.orders || 0}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:center;">${Number(r.hours || 0).toFixed(2)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.rate)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.laborPay)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.materialCost)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.materialBonus)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;"><b>${formatMoney(r.totalPay)}</b></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  const heading = document.querySelector("#techSummaryBox h3");
  if (heading) heading.innerText = "Resumen Tecnicos - " + label;
}

function load() {
  const user = getCurrentUser();

  if (String(user.role || "").toUpperCase() === "OWNER") {
    loadCompanySelector();

    if (!ACTIVE_COMPANY_ID) {
      return;
    }
  }

  if (!ACTIVE_COMPANY_ID) {
    ACTIVE_COMPANY_ID = String(user.companyId || "").toUpperCase();
  }

  if (!ACTIVE_COMPANY_ID) {
    document.getElementById("cards").innerHTML = "No hay compañía asignada.";
    clearEconomyMetrics();
    return;
  }

  updateHeaderCompany(ACTIVE_COMPANY_ID);
  document.getElementById("cards").innerHTML = "Loading...";

  if (VIEW_MODE === "PM") {
    google.script.run
      .withSuccessHandler(function(res) {
        ECONOMY = res || [];
        loadPeriodFilter();
        render();
      })
      .withFailureHandler(function(err) {
        renderServerError(err, "cards", "ERROR PM_ECONOMY: ");
      })
      .getPMEconomyData(ACTIVE_COMPANY_ID, user.role, getSessionToken());

    return;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      ECONOMY = res || [];
      loadPeriodFilter();
      render();
    })
    .withFailureHandler(function(err) {
      renderServerError(err, "cards", "ERROR: ");
    })
    .getEconomyData(ACTIVE_COMPANY_ID, user.role, getSessionToken());
}

function render() {
  initMetricPeriodControls();

  const search = document.getElementById("search").value.toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const period = document.getElementById("periodFilter").value;
  const periodMode = String(document.getElementById("metricPeriodMode").value || "period");

  const baseFiltered = ECONOMY.filter(function(o) {
    const text = JSON.stringify(o).toLowerCase();

    return (!search || text.includes(search)) &&
           (!status || String(o.STATUS || "").toUpperCase() === status) &&
           (periodMode !== "period" || !period || String(o.PERIOD_LABEL || "") === period) &&
           economyRecordMatchesMetricPeriod(o);
  });

  renderEconomyMetrics(baseFiltered);
  const filtered = applyEconomyMetricFilter(baseFiltered);

  document.getElementById("cards").innerHTML =
    filtered.length
      ? filtered.map(card).join("")
      : "No economy records found.";
}

function initMetricPeriodControls() {
  if (METRIC_PERIOD_INITIALIZED) {
    syncMetricPeriodControlVisibility();
    return;
  }

  const now = new Date();
  const month = document.getElementById("metricPeriodMonth");
  const year = document.getElementById("metricPeriodYear");

  if (month) month.value = String(now.getMonth() + 1);
  if (year && !year.value) year.value = now.getFullYear();

  METRIC_PERIOD_INITIALIZED = true;
  syncMetricPeriodControlVisibility();
}

function onMetricPeriodModeChange() {
  syncMetricPeriodControlVisibility();
  render();
}

function syncMetricPeriodControlVisibility() {
  const mode = String(document.getElementById("metricPeriodMode").value || "period");
  const periodFilter = document.getElementById("periodFilter");
  const month = document.getElementById("metricPeriodMonth");
  const year = document.getElementById("metricPeriodYear");

  if (periodFilter) periodFilter.style.display = mode === "period" ? "" : "none";
  if (month) month.style.display = mode === "monthly" ? "" : "none";
  if (year) year.style.display = (mode === "monthly" || mode === "annual") ? "" : "none";
}

function economyRecordMatchesMetricPeriod(row) {
  const mode = String(document.getElementById("metricPeriodMode").value || "period");
  if (mode === "all" || mode === "period") return true;

  const year = Number(document.getElementById("metricPeriodYear").value || new Date().getFullYear());
  const month = Number(document.getElementById("metricPeriodMonth").value || (new Date().getMonth() + 1));
  const periodYear = Number(row.PERIOD_YEAR || 0);
  const periodMonth = Number(row.PERIOD_MONTH || 0);
  const periodLabel = String(row.PERIOD_LABEL || "").trim();

  if (mode === "annual") {
    if (periodYear && periodYear === year) return true;
    if (periodLabel && periodLabel.indexOf(String(year)) === 0) return true;
  }

  if (mode === "monthly") {
    const wantedLabel = year + "-" + String(month).padStart(2, "0");
    if (periodLabel && periodLabel === wantedLabel) return true;
    if (periodYear && periodMonth && periodYear === year && periodMonth === month) return true;
  }

  const date = getEconomyRecordDate(row);
  if (!date) return false;

  if (mode === "annual") return date.getFullYear() === year;
  return date.getFullYear() === year && (date.getMonth() + 1) === month;
}

function getEconomyRecordDate(row) {
  const value = row.DATE_INVOICE || row.DATE_COMPLETED || row.DATE_PAID || row.CREATED_AT || row.DATE_CREATED;
  if (!value) return null;

  const date = new Date(value);
  return isNaN(date.getTime()) ? null : date;
}

function clearEconomyMetrics() {
  const metrics = document.getElementById("economyMetrics");
  const info = document.getElementById("economyMetricInfo");
  if (metrics) metrics.innerHTML = "";
  if (info) {
    info.style.display = "none";
    info.innerHTML = "";
  }
}

function renderEconomyMetrics(rows) {
  const metrics = calculateEconomyMetrics(rows);
  const cards = getEconomyMetricCards(metrics);

  document.getElementById("economyMetrics").innerHTML =
    cards.map(renderEconomyMetricButton).join("");

  const active = cards.find(function(card) {
    return card.key === ECONOMY_METRIC_FILTER;
  }) || cards[0];

  const filtered = applyEconomyMetricFilter(rows);
  const info = document.getElementById("economyMetricInfo");
  info.style.display = "block";
  info.innerHTML =
    "<b>" + (active ? active.label : "All Records") + ":</b> " +
    filtered.length + " records shown after filters.";
}

function renderEconomyMetricButton(card) {
  const active = card.key === ECONOMY_METRIC_FILTER ? " active" : "";
  return `
    <button type="button" class="metric metric-button ${card.tone || "neutral"}${active}"
      onclick="filterEconomyMetric('${card.key}')">
      <div class="metric-label">${card.label}</div>
      <div class="metric-value">${card.value}</div>
      <div class="metric-note">${card.note || ""} | View records</div>
    </button>
  `;
}

function filterEconomyMetric(key) {
  ECONOMY_METRIC_FILTER = String(key || "all");
  render();
}

function getEconomyMetricCards(m) {
  if (VIEW_MODE === "PM") {
    return [
      { key:"all", label:"PM Records", value:m.count, note:"All PM economy rows", tone:"info" },

function calculateEconomyMetrics(rows) {
  const totals = {
    count: rows.length,
    pending: 0,
    invoiced: 0,
    paid: 0,
    amount: 0,
    tax: 0,
    cost: 0,
    profit: 0,
    techPay: 0,
    hours: 0,
    laborBilled: 0,
    billedParts: 0,
    david: 0,
    yoel: 0
  };

  rows.forEach(function(o) {
    const status = String(o.STATUS || "PENDING").toUpperCase();
    const amount = parseEconomyNumber(o.AMOUNT);
    const tax = parseEconomyNumber(o.TAX);
    const rawCost = parseEconomyNumber(o.COST);
    const realCost = calculateRealPartsCost(o.INV_SOURCE, rawCost);
    const techPay = parseEconomyNumber(o.TECH_LABOR_COST || o.TECH_LABOR_PAY);
    const hours = parseEconomyNumber(o.HORAS || o.LABOR_HOURS);
    const laborBilled = parseEconomyNumber(o.LABOR_BILLED || o.LABOR_AMOUNT || o.LABOR) ||
      calculateEconomyLaborCharge(hours);
    const billedParts = parseEconomyNumber(o.PARTS_BILLED || o.PARTS_AMOUNT || o.PARTS) ||
      Math.max(0, amount - tax - laborBilled);
    const profit = amount - tax - realCost - techPay;
    const split = getInvestmentSplitValues(o.INV_SOURCE, rawCost);

    if (!status || status === "PENDING") totals.pending++;
    if (status === "INVOICED") totals.invoiced++;
    if (status === "PAID") totals.paid++;

    totals.amount += amount;
    totals.tax += tax;
    totals.cost += realCost;
    totals.profit += profit;
    totals.techPay += techPay;
    totals.hours += hours;
    totals.laborBilled += laborBilled;
    totals.billedParts += billedParts;
    totals.david += split.david;
    totals.yoel += split.yoel;
  });

  return totals;
}

function applyEconomyMetricFilter(rows) {
  const key = String(ECONOMY_METRIC_FILTER || "all");

  if (key === "all") return rows;

  return rows.filter(function(o) {
    const status = String(o.STATUS || "PENDING").toUpperCase();
    const amount = parseEconomyNumber(o.AMOUNT);
    const tax = parseEconomyNumber(o.TAX);
    const rawCost = parseEconomyNumber(o.COST);
    const realCost = calculateRealPartsCost(o.INV_SOURCE, rawCost);
    const techPay = parseEconomyNumber(o.TECH_LABOR_COST || o.TECH_LABOR_PAY);
    const hours = parseEconomyNumber(o.HORAS || o.LABOR_HOURS);
    const laborBilled = parseEconomyNumber(o.LABOR_BILLED || o.LABOR_AMOUNT || o.LABOR) ||
      calculateEconomyLaborCharge(hours);
    const billedParts = parseEconomyNumber(o.PARTS_BILLED || o.PARTS_AMOUNT || o.PARTS) ||
      Math.max(0, amount - tax - laborBilled);
    const profit = amount - tax - realCost - techPay;
    const split = getInvestmentSplitValues(o.INV_SOURCE, rawCost);

    if (key === "pending") return !status || status === "PENDING";
    if (key === "invoiced") return status === "INVOICED";
    if (key === "paid") return status === "PAID";
    if (key === "amount") return amount > 0;
    if (key === "tax") return tax > 0;
    if (key === "billedParts") return billedParts > 0;
    if (key === "laborBilled") return laborBilled > 0;
    if (key === "cost") return realCost > 0;
    if (key === "techPay") return techPay > 0;
    if (key === "profit") return profit !== 0;
    if (key === "hours") return hours > 0;
    if (key === "david") return split.david > 0;
    if (key === "yoel") return split.yoel > 0;
    return true;
  });
}

function parseEconomyNumber(value) {
  const cleaned = String(value || "")
    .replace(/[$,\s]/g, "")
    .replace(/[^\d.-]/g, "");
  const n = Number(cleaned);
  return isNaN(n) ? 0 : n;
}

function calculateRealPartsCost(source, cost) {
  source = String(source || "").trim().toUpperCase();
  cost = Number(cost || 0);

  return source === "YOEL" ? cost : 0;
}

function calculateEconomyLaborCharge(hours) {
  hours = Number(hours || 0);
  if (hours <= 0) return 0;
  if (hours <= 1) return 200;
  return 200 + ((hours - 1) * 130);
}

function parseTechPayDetail(o) {
  const detailText = String(o.TECH_PAY_DETAIL || "").trim();
  const techniciansText = String(o.TECHNICIANS || "").trim();

  if (!detailText) {
    const techs = techniciansText
      .split(",")
      .map(function(t) { return t.trim(); })
      .filter(Boolean);

    if (!techs.length) return [];

    const total = Number(o.TECH_LABOR_COST || 0);
    const each = techs.length ? total / techs.length : 0;

    return techs.map(function(name) {
      return {
        name: name,
        detail: "",
        pay: each
      };
    });
  }

  return detailText.split("|").map(function(part) {
    part = part.trim();

    const pieces = part.split(":");
    const name = pieces[0] ? pieces[0].trim() : "Técnico";

    let pay = 0;

    const payMatchEqual = part.match(/=\s*\$?([\d,.]+)/);
    const payMatchDollar = part.match(/\$([\d,.]+)/);

    if (payMatchEqual) {
      pay = Number(payMatchEqual[1].replace(/,/g, ""));
    } else if (payMatchDollar) {
      pay = Number(payMatchDollar[1].replace(/,/g, ""));
    }

    const detail = pieces.length > 1 ? pieces.slice(1).join(":").trim() : "";

    return {
      name: name,
      detail: detail,
      pay: pay
    };
  });
}

function formatMoney(value) {

function formatMoneyValue(v) {

function parsePmSummaryFromNotes(noteText) {
  const summary = {};
  const labelMap = {
    "PM Invoice Total": "invoiceTotal",
    "Subtotal": "invoiceSubtotal",
    "Tax": "invoiceTax",
    "Paid to D&D": "ddPayment",
    "Tech Pay": "techPay",
    "D&D Profit": "ddProfit"
  };

  String(noteText || "").split("|").forEach(function(part) {
    const pieces = part.split(":");
    if (pieces.length < 2) return;

    const key = labelMap[pieces[0].trim()];
    if (!key) return;

    const numeric = pieces.slice(1).join(":").replace(/[^0-9.-]/g, "");
    if (!numeric) return;

    summary[key] = Number(numeric);
  });

  return summary;
}

function getPmDerivedValues(record, noteTextOverride) {
  const legacyPmDefaults = {
    subtotal: 391.67,
    tax: 27.42,
    total: 419.09
  };
  const safeRecord = record || {};
  const notes = noteTextOverride !== undefined ? noteTextOverride : safeRecord.NOTES;
  const noteSummary = parsePmSummaryFromNotes(notes);
  const amount = parseEconomyNumber(safeRecord.AMOUNT);
  const techPay = parseEconomyNumber(
    safeRecord.TECH_LABOR_COST || safeRecord.TECH_LABOR_PAY || safeRecord.COST
  );
  const tax = noteSummary.invoiceTax !== undefined
    ? noteSummary.invoiceTax
    : (parseEconomyNumber(safeRecord.TAX) || legacyPmDefaults.tax);
  const profit = String(safeRecord.PROFIT || "").trim() !== ""
    ? parseEconomyNumber(safeRecord.PROFIT)
    : (noteSummary.ddProfit !== undefined
      ? noteSummary.ddProfit
      : (amount - tax - techPay));
  const subtotal = noteSummary.invoiceSubtotal !== undefined
    ? noteSummary.invoiceSubtotal
    : legacyPmDefaults.subtotal;
  const invoiceTotal = noteSummary.invoiceTotal !== undefined
    ? noteSummary.invoiceTotal
    : legacyPmDefaults.total;

  return {
    noteSummary: noteSummary,
    amount: amount,
    techPay: techPay,
    tax: tax,
    profit: profit,
    subtotal: subtotal,
    invoiceTotal: invoiceTotal
  };
}

function getInvestmentSplitValues(source, cost) {
  source = String(source || "").toUpperCase();
  cost = Number(cost || 0);

  if (source === "YOEL") {
    return {
      david: cost * 0.25,
      yoel: cost * 0.75
    };
  }

  if (source === "DAVID") {
    return {
      david: cost * 0.75,
      yoel: cost * 0.25
    };
  }

  if (source === "MISCELANEAS") {
    return {
      david: cost * 0.50,
      yoel: cost * 0.50
    };
  }

  return {
    david: 0,
    yoel: 0
  };
}

function save(row, btn) {
  const currentRecord = getEconomyRecordByRowNumber(row);
  const isPM = VIEW_MODE === "PM" || String(currentRecord && currentRecord.INV_SOURCE || "").toUpperCase() === "PM";

  const updates = {
    AMOUNT: document.getElementById("amount_" + row).value,
    COST: document.getElementById("cost_" + row).value,
    STATUS: document.getElementById("status_" + row).value,
    INVOICE_NUMBER: document.getElementById("invoice_" + row).value,
    NOTES: document.getElementById("notes_" + row).value
  };

  if (!isPM) {
    updates.INV_SOURCE = document.getElementById("inv_" + row).value;
  } else {
    const pmAmount = parseEconomyNumber(updates.AMOUNT);
    const pmCost = parseEconomyNumber(updates.COST);
    const currentDetail = String(currentRecord && currentRecord.TECH_PAY_DETAIL || "").trim();
    const pmTax = getPmDerivedValues(
      Object.assign({}, currentRecord, {
        AMOUNT: updates.AMOUNT,
        COST: updates.COST,
        TECH_LABOR_COST: updates.COST,
        NOTES: updates.NOTES,
        PROFIT: ""
      }),
      updates.NOTES
    ).tax;

    updates.INV_SOURCE = "PM";
    updates.TECH_LABOR_COST = pmCost;
    updates.PROFIT = (pmAmount - pmTax - pmCost).toFixed(2);

    if (!currentDetail || currentDetail.indexOf("|") === -1) {
      const techName = currentDetail
        ? String(currentDetail.split(":")[0] || "Technician").trim()
        : String(currentRecord && currentRecord.TECHNICIANS || "Technician").trim();
      updates.TECH_PAY_DETAIL = techName + ": $" + pmCost.toFixed(2);
    }
  }

  btn.innerText = "Guardando...";
  btn.disabled = true;

  const runner = google.script.run
    .withSuccessHandler(function() {
      btn.innerText = "Guardado ✔";
      btn.classList.add("saved");
      btn.disabled = false;
      load();
    })
    .withFailureHandler(function(err) {
      btn.innerText = "Error";
      btn.disabled = false;
      alertServerError(err);
    });

  if (isPM) {
    runner.updatePMEconomyRow(row, updates, getSessionToken());
  } else {
    runner.updateEconomyRow(row, updates, getSessionToken());
  }
}

function activateCompany() {
  ACTIVE_COMPANY_ID = document.getElementById("companySelect").value;
  ECONOMY_METRIC_FILTER = "all";

  if (!ACTIVE_COMPANY_ID) {
    alert("Seleccione una empresa.");
    return;
  }

  saveOwnerCompanyId(ACTIVE_COMPANY_ID);
  updateHeaderCompany(ACTIVE_COMPANY_ID);
  loadPeriod();
  load();
}

function syncInvoices() {
  if (!ACTIVE_COMPANY_ID) {
    alert("Primero cargue la compañía.");
    return;
  }

  google.script.run
    .withSuccessHandler(function() {
      alert("Invoices sincronizados");
      load();
    })
    .withFailureHandler(function(err) {
      alertServerError(err);
    })
    .syncInvoicesToEconomy(ACTIVE_COMPANY_ID, getSessionToken());
}

function updateInvView(row) {
  if (VIEW_MODE === "PM") return;

  const source = document.getElementById("inv_" + row).value;
  const cost = document.getElementById("cost_" + row).value;

  const split = getInvestmentSplitValues(source, cost);
  const realCost = calculateRealPartsCost(source, cost);

  const davidBox = document.getElementById("inv_david_" + row);
  const yoelBox = document.getElementById("inv_yoel_" + row);
  const realCostBox = document.getElementById("real_cost_" + row);

  if (davidBox) davidBox.innerText = formatMoney(split.david);
  if (yoelBox) yoelBox.innerText = formatMoney(split.yoel);
  if (realCostBox) realCostBox.innerText = formatMoney(realCost);
}

function loadPeriod() {
  google.script.run
    .withSuccessHandler(function(p) {
      CURRENT_PERIOD_LABEL = p && p.label ? p.label : "";

      document.getElementById("periodLabel").innerText =
        CURRENT_PERIOD_LABEL ? "Periodo: " + CURRENT_PERIOD_LABEL : "Periodo no definido";

      loadPeriodFilter();
      render();
    })
    .withFailureHandler(function(err) {
      document.getElementById("periodLabel").innerText =
        "ERROR periodo: " + err.message;
    })
    .getCurrentEconomyPeriod();
}

function closeMonth() {
  const btn = document.getElementById("closeMonthBtn");
  if (btn && btn.disabled) return;

  if (!confirm("Cerrar mes economico? Los registros del periodo actual quedaran archivados y la pantalla abrira el nuevo periodo.")) return;

  if (btn) {
    btn.disabled = true;
    btn.innerText = "Cerrando...";
  }

  google.script.run
    .withSuccessHandler(function(p) {
      alert(
        "Mes cerrado.\n" +
        "Periodo archivado: " + (p.previousLabel || "") + "\n" +
        "Registros archivados: " + (p.closedRows || 0) + "\n" +
        "Nuevo periodo: " + p.label
      );
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Cerrar Mes";
      }
      loadPeriod();
      load();
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Cerrar Mes";
      }
      alert(err.message);
    })
    .closeEconomyMonth(getSessionToken());
}

function loadPeriodFilter() {
  const select = document.getElementById("periodFilter");
  if (!select) return;

  const current = select.value;

  const periodSet = {};
  if (CURRENT_PERIOD_LABEL) periodSet[CURRENT_PERIOD_LABEL] = true;

  ECONOMY.forEach(function(o) {
    const label = String(o.PERIOD_LABEL || o.ACCOUNTING_PERIOD || "").trim();
    if (label) periodSet[label] = true;
  });

  const periods = Object.keys(periodSet).sort().reverse();

  select.innerHTML =
    `<option value="">All Periods</option>` +
    periods.map(function(p) {
      return `<option value="${p}">${p}</option>`;
    }).join("");

  if (current && periods.includes(current)) {
    select.value = current;
  } else if (CURRENT_PERIOD_LABEL) {
    select.value = CURRENT_PERIOD_LABEL;
  }

  syncMetricPeriodControlVisibility();
}

function syncOldLog() {
  if (!ACTIVE_COMPANY_ID) {
    alert("Primero cargue la compañía.");
    return;
  }

  const btn = document.getElementById("syncOldBtn");
  if (btn) {
    btn.disabled = true;
    btn.innerText = "Importing...";
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Import Old History";
      }

      alert(
        "Historial viejo importado.\n" +
        "Nuevos: " + (res.imported || 0) + "\n" +
        "Actualizados: " + (res.updated || 0) + "\n" +
        "Ya estaban en economía activa: " + (res.skippedActive || 0) +
        formatImportInvoiceList("Actualizados", res.updatedInvoices) +
        formatImportInvoiceList("Nuevos", res.importedInvoices, 12)
      );
      load();
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Import Old History";
      }
      alertServerError(err);
    })
    .syncOldEconomyLogToHistory(ACTIVE_COMPANY_ID, getSessionToken());
}

function formatImportInvoiceList(label, invoices, maxItems) {
  invoices = Array.isArray(invoices) ? invoices.filter(Boolean) : [];
  if (!invoices.length) return "";

  maxItems = maxItems || 25;
  const shown = invoices.slice(0, maxItems);
  const extra = invoices.length > maxItems ? " +" + (invoices.length - maxItems) + " más" : "";

  return "\n\n" + label + ":\n" + shown.join(", ") + extra;
}

function loadOldDDSummary() {
  document.getElementById("oldDDSummaryBox").style.display = "block";
  document.getElementById("oldDDSummaryBox").innerHTML = "Sincronizando histórico D&D...";

  google.script.run
    .withSuccessHandler(function() {
      document.getElementById("oldDDSummaryBox").innerHTML = "Cargando histórico D&D...";

      google.script.run
        .withSuccessHandler(function(rows) {
          renderOldDDSummary(rows || []);
        })
        .withFailureHandler(function(err) {
          document.getElementById("oldDDSummaryBox").innerHTML =
            "ERROR histórico D&D: " + err.message;
        })
        .getOldDDPremierMonthlyData(getSessionToken());
    })
    .withFailureHandler(function(err) {
      document.getElementById("oldDDSummaryBox").innerHTML =
        "ERROR sincronizando histórico D&D: " + err.message;
    })
    .syncOldDDPremierMonthly(getSessionToken());
}

function renderOldDDSummary(rows) {
  if (!rows.length) {
    document.getElementById("oldDDSummaryBox").innerHTML =
      "<h3>Histórico D&D Premier</h3>No hay datos.";
    return;
  }

  document.getElementById("oldDDSummaryBox").innerHTML = `
    <h3>Histórico D&D Premier</h3>
    <div style="overflow:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead>
          <tr style="background:#f3f4f6;">
            <th style="padding:8px; border:1px solid #e5e7eb;">Mes</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Horas</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Parts</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Cobro Horas</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Cobro Parts</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Total D&D</th>
            <th style="padding:8px; border:1px solid #e5e7eb;">Total Facturado</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(function(r) {
            return `
              <tr>
                <td style="padding:8px; border:1px solid #e5e7eb;">${r.MES || ""}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${Number(r.TOTAL_HORAS || 0).toFixed(2)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.TOTAL_PARTS)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.TOTAL_COBRO_HORAS)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.TOTAL_COBRO_PARTS)}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;"><b>${formatMoney(r.TOTAL_COMPANIA)}</b></td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">${formatMoney(r.TOTAL_FACTURADO)}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

if (requireEconomyLogin()) {
  initSummaryDate();
  loadPeriod();
  load();
}
</script>
