  body.app-watermark {
    position:relative;
    overflow-x:hidden;
  }

  body.app-watermark::before {
    content:"";
    position:fixed;
    inset:0;
    background-image:var(--company-watermark-logo);
    background-repeat:var(--company-watermark-repeat);
    background-position:var(--company-watermark-position);
    background-size:var(--company-watermark-size);
    opacity:var(--company-watermark-opacity);
    filter:var(--company-watermark-filter);
    pointer-events:none;
    z-index:0;
  }

  body.app-watermark > * {
    position:relative;
    z-index:1;
  }

  @media (max-width:800px) {
    body.app-watermark::before {
      background-size:var(--company-watermark-size);
      opacity:var(--company-watermark-opacity);
    }
  }
