<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background:#f3f4f6;
      margin:0;
      padding:15px;
      color:#111827;
    }

    .header {
      background:white;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .topbar {
      margin-bottom:15px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    button {
      padding:10px 14px;
      border-radius:10px;
      border:none;
      font-size:14px;
      color:white;
      font-weight:bold;
      background:#111827;
      cursor:pointer;
      margin-right:6px;
    }

    button:disabled {
      background:#9ca3af;
      cursor:not-allowed;
    }

    .pdf-btn {
      background:#2563eb;
      margin-top:10px;
    }

    .pdf-btn.missing {
      background:#9ca3af;
    }

    .quote-btn {
      background:#7c3aed;
      margin-top:10px;
    }

    .report-btn {
      background:#2563eb;
      margin-top:10px;
    }

    .report-btn.missing {
      background:#9ca3af;
    }

    .quote-approved-btn {
      background:#16a34a;
      margin-top:10px;
    }

    .quote-approved-label {
      background:#dcfce7;
      color:#166534;
      padding:8px 10px;
      border-radius:10px;
      font-weight:bold;
      margin-top:10px;
      display:inline-block;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
      gap:15px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      border-left:6px solid #16a34a;
    }

    .urgent { border-left-color:orange; }
    .emergency { border-left-color:red; }
    .parts { border-left-color:#7c3aed; }
    .closed { border-left-color:#6b7280; }

    .card-top {
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .status {
      background:#e5e7eb;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      margin-top:5px;
      display:inline-block;
    }

    .age-badge {
      background:#111827;
      color:white;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      white-space:nowrap;
    }

    .small {
      font-size:14px;
      margin:6px 0;
    }

    .problem {
      background:#f9fafb;
      padding:10px;
      border-radius:10px;
      margin-top:8px;
      white-space:pre-wrap;
    }

    .progress-box {
      margin-top:12px;
      background:#f9fafb;
      border-radius:12px;
      padding:10px;
    }

    .progress-title {
      font-size:13px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .steps {
      display:grid;
      gap:6px;
    }

    .step {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
    }

    .dot {
      width:13px;
      height:13px;
      border-radius:50%;
      background:#dc2626;
      flex:none;
    }

    .step.done .dot {
      background:#16a34a;
    }

    .step.done span {
      font-weight:bold;
      color:#166534;
    }

    .stats {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:10px 0 15px;
    }

    .stat {
      background:white;
      padding:10px 14px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.07);
      font-size:14px;
    }

    .filters {
      background:white;
      border-radius:14px;
      padding:14px;
      margin:12px 0 15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      border-top:4px solid #111827;
    }

    .filter-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:10px;
      align-items:end;
    }

    .filter-field {
      display:grid;
      gap:5px;
      font-size:12px;
      font-weight:bold;
      color:#374151;
    }

    .filter-field input,
    .filter-field select {
      width:100%;
      min-height:40px;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:9px 10px;
      font-size:14px;
      background:#ffffff;
      color:#111827;
    }

    .filter-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:end;
    }

    .clear-btn {
      background:#6b7280;
    }

    .filter-summary {
      margin-top:10px;
      font-size:13px;
      color:#4b5563;
    }

    @media (max-width:420px) {
      .grid { grid-template-columns:1fr; }
      .card { width:100%; }
      .header { display:block; }
    }
  </style>
  <?!= include("AppWatermark"); ?>
</head>

<body class="app-watermark" style="--company-watermark-logo:<?!= watermarkLogoCss ?>;">

<?!= include("AppBackButton"); ?>

<div class="header">
  <div id="companyTitle" style="font-size:20px; font-weight:bold;">
    Company: Loading...
  </div>

  <div>
    <b>D&D Premier Solutions Corp</b><br>
    <small>Supervisor Order Portal</small>
  </div>
</div>

<h2>Supervisor Portal</h2>
<div>Supervisor: <b><?= supervisor ?></b></div>

<div class="topbar">
  <button onclick="loadOrders()">Refresh</button>
</div>

<div class="filters">
  <div class="filter-grid">
    <label class="filter-field">
      Search
      <input id="searchFilter" type="search" placeholder="WO, NSN, address, issue..." oninput="applyFilters()">
    </label>

    <label class="filter-field">
      Status
      <select id="statusFilter" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="open">Open Orders</option>
        <option value="completed">Completed / Closed</option>
        <option value="invoiced">Invoiced</option>
        <option value="parts">Buying / Parts</option>
        <option value="emergency">Emergency / Urgent</option>
        <option value="invoicePdf">Has Invoice PDF</option>
        <option value="quote">Has Quote</option>
        <option value="pmReport">Has PM Report</option>
      </select>
    </label>

    <label class="filter-field">
      Technician
      <select id="techFilter" onchange="applyFilters()">
        <option value="">All Technicians</option>
      </select>
    </label>

    <label class="filter-field">
      Priority
      <select id="priorityFilter" onchange="applyFilters()">
        <option value="">All Priorities</option>
      </select>
    </label>

    <label class="filter-field">
      Type
      <select id="typeFilter" onchange="applyFilters()">
        <option value="">All Types</option>
      </select>
    </label>

    <label class="filter-field">
      Created From
      <input id="dateFromFilter" type="date" onchange="applyFilters()">
    </label>

    <label class="filter-field">
      Created To
      <input id="dateToFilter" type="date" onchange="applyFilters()">
    </label>

    <div class="filter-actions">
      <button type="button" onclick="applyFilters()">Apply</button>
      <button type="button" class="clear-btn" onclick="clearFilters()">Clear</button>
    </div>
  </div>
  <div id="filterSummary" class="filter-summary"></div>
</div>

<div id="stats" class="stats"></div>
<div id="orders" class="grid">Loading...</div>

<script>
function navigateApp(url) {
  const target = String(url || "").trim();
  if (!target) return;

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "PPS_NAVIGATE", url: target }, "*");
      setTimeout(function() {
        try {
          window.open(target, "_top");
        } catch (err) {
          window.location.href = target;
        }
      }, 250);
      return;
    }
  } catch (err) {}

  try {
    window.open(target, "_top");
  } catch (err) {
    window.location.href = target;
  }
}

const TOP_NAV = {
  set href(url) {
    navigateApp(url);
  }
};

const SUPERVISOR = "<?= supervisor ?>";
const BASE_URL = "<?= baseUrl ?>";
let ALL_ORDERS = [];

function requireLogin() {
  const user = localStorage.getItem("pps_user");

  if (!user) {
    TOP_NAV.href = BASE_URL;
    return false;
  }

  try {
    const parsed = JSON.parse(user);
    if ((!parsed.role && !parsed.ROLE) || (!parsed.sessionToken && !parsed.SESSION_TOKEN)) {
      localStorage.removeItem("pps_user");
      TOP_NAV.href = BASE_URL;
      return false;
    }
  } catch (e) {
    localStorage.removeItem("pps_user");
    TOP_NAV.href = BASE_URL;
    return false;
  }

  return true;
}

if (!requireLogin()) {
  throw new Error("Not authorized");
}

function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem("pps_user") || "{}");
  } catch (e) {
    return {};
  }
}

function getSessionToken() {
  const user = getCurrentUser();
  return user.sessionToken || user.SESSION_TOKEN || "";
}

function getCurrentCompanyId() {
  const user = getCurrentUser();
  return String(user.companyId || user.COMPANY_ID || "").toUpperCase();
}

function esc(v) {
  return String(v || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function jsEsc(v) {
  return String(v || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');
}

function loadHeader() {
  google.script.run
    .withSuccessHandler(function(name) {
      document.getElementById("companyTitle").innerText = "Company: " + name;
    })
    .getSupervisorCompany(SUPERVISOR);
}

function loadOrders() {
  document.getElementById("orders").innerHTML = "Loading...";

  google.script.run
    .withSuccessHandler(function(data) {
      ALL_ORDERS = Array.isArray(data) ? data : [];
      populateFilterOptions(ALL_ORDERS);
      applyFilters();
    })
    .withFailureHandler(function(err) {
      document.getElementById("orders").innerHTML = "ERROR: " + err.message;
    })
    .getCustomerOrdersBySupervisor(SUPERVISOR, getSessionToken(), getCurrentCompanyId());
}

function render(data) {
  renderStats(data, ALL_ORDERS.length);
  renderFilterSummary(data.length, ALL_ORDERS.length);

  if (!data.length) {
    document.getElementById("orders").innerHTML = "No orders found.";
    return;
  }

  document.getElementById("orders").innerHTML = data.map(card).join("");
}

function applyFilters() {
  render(getFilteredOrders());
}

function clearFilters() {
  [
    "searchFilter",
    "statusFilter",
    "techFilter",
    "priorityFilter",
    "typeFilter",
    "dateFromFilter",
    "dateToFilter"
  ].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  applyFilters();
}

function getFilteredOrders() {
  const search = normalizeSearch(document.getElementById("searchFilter").value);
  const statusFilter = String(document.getElementById("statusFilter").value || "");
  const techFilter = String(document.getElementById("techFilter").value || "");
  const priorityFilter = String(document.getElementById("priorityFilter").value || "");
  const typeFilter = String(document.getElementById("typeFilter").value || "");
  const dateFrom = parseDateOnly(document.getElementById("dateFromFilter").value);
  const dateTo = parseDateOnly(document.getElementById("dateToFilter").value);

  return ALL_ORDERS.filter(function(o) {
    if (search && normalizeSearch(getOrderSearchText(o)).indexOf(search) === -1) return false;
    if (statusFilter && !matchesStatusFilter(o, statusFilter)) return false;
    if (techFilter && normalizeSearch(o.TECHNICIAN || "Not assigned") !== techFilter) return false;
    if (priorityFilter && normalizeSearch(getOrderDisplayPriority(o)) !== priorityFilter) return false;
    if (typeFilter && normalizeSearch(getOrderDisplayType(o)) !== typeFilter) return false;

    const created = parseOrderDate(o.DATE_CREATED || o.CREATED_AT || o.CREATED_DATE);
    if (dateFrom && (!created || created < dateFrom)) return false;
    if (dateTo) {
      const end = new Date(dateTo);
      end.setHours(23, 59, 59, 999);
      if (!created || created > end) return false;
    }

    return true;
  });
}

function matchesStatusFilter(o, filter) {
  const status = normalizeStatus(o.STATUS);

  if (filter === "open") return !isClosedStatus(status);
  if (filter === "completed") return isClosedStatus(status);
  if (filter === "invoiced") return status.includes("INVOICED") || String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES";
  if (filter === "parts") return isPartsStatus(status);
  if (filter === "emergency") return isEmergencyPriority(o.ORDER_PRIORITY);
  if (filter === "invoicePdf") return String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES";
  if (filter === "quote") return Boolean(o.QUOTE_EN_URL || o.QUOTE_ES_URL);
  if (filter === "pmReport") return String(o.HAS_PM_REPORT_PDF || "").toUpperCase() === "YES";

  return true;
}

function populateFilterOptions(data) {
  setFilterOptions(
    "techFilter",
    "All Technicians",
    uniqueSorted(data.map(function(o) { return o.TECHNICIAN || "Not assigned"; }))
  );

  setFilterOptions(
    "priorityFilter",
    "All Priorities",
    uniqueSorted(data.map(getOrderDisplayPriority).filter(Boolean))
  );

  setFilterOptions(
    "typeFilter",
    "All Types",
    uniqueSorted(data.map(getOrderDisplayType).filter(Boolean))
  );
}

function setFilterOptions(id, firstLabel, values) {
  const el = document.getElementById(id);
  if (!el) return;

  const current = el.value;
  el.innerHTML =
    "<option value=''>" + esc(firstLabel) + "</option>" +
    values.map(function(value) {
      const key = normalizeSearch(value);
      return "<option value='" + esc(key) + "'>" + esc(value) + "</option>";
    }).join("");

  if ([].slice.call(el.options).some(function(option) { return option.value === current; })) {
    el.value = current;
  }
}

function uniqueSorted(values) {
  const seen = {};

  values.forEach(function(value) {
    value = String(value || "").trim();
    if (!value) return;
    seen[normalizeSearch(value)] = value;
  });

  return Object.keys(seen)
    .sort(function(a, b) { return seen[a].localeCompare(seen[b]); })
    .map(function(key) { return seen[key]; });
}

function renderFilterSummary(visible, total) {
  const summary = document.getElementById("filterSummary");
  if (!summary) return;

  if (!total) {
    summary.innerText = "No assigned orders loaded.";
    return;
  }

  summary.innerText = "Showing " + visible + " of " + total + " assigned orders.";
}

function getOrderSearchText(o) {
  return [
    o.WO_NUMBER,
    o.NSN,
    o.STORE_NAME,
    o.STORE_ADDRESS,
    o.CLIENT,
    o.TECHNICIAN,
    getOrderDisplayStatus(o),
    getOrderDisplayPriority(o),
    getOrderDisplayType(o),
    getOrderDisplayEquipment(o),
    getOrderDisplayProblem(o)
  ].join(" ");
}

function normalizeSearch(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function parseDateOnly(value) {
  if (!value) return null;
  const parts = String(value).split("-");
  if (parts.length !== 3) return null;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return isNaN(d) ? null : d;
}

function parseOrderDate(value) {
  if (!value) return null;
  const d = new Date(value);
  return isNaN(d) ? null : d;
}

function renderStats(data, totalAll) {
  const total = data.length;
  const completed = data.filter(o => isClosedStatus(o.STATUS)).length;
  const parts = data.filter(o => isPartsStatus(o.STATUS)).length;
  const emergency = data.filter(o => isEmergencyPriority(o.ORDER_PRIORITY)).length;
  const invoiced = data.filter(o => String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES").length;
  const quotes = data.filter(o => o.QUOTE_EN_URL || o.QUOTE_ES_URL).length;
  const pmReports = data.filter(o => String(o.HAS_PM_REPORT_PDF || "").toUpperCase() === "YES").length;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>Showing:</b> ${total}${totalAll && totalAll !== total ? " / " + totalAll : ""}</div>
    <div class="stat"><b>Completed:</b> ${completed}</div>
    <div class="stat"><b>Buying Parts:</b> ${parts}</div>
    <div class="stat"><b>Invoiced:</b> ${invoiced}</div>
    <div class="stat"><b>Quotes:</b> ${quotes}</div>
    <div class="stat"><b>PM Reports:</b> ${pmReports}</div>
    <div class="stat"><b>Emergency:</b> ${emergency}</div>
  `;
}

function card(o) {
  const s = normalizeStatus(o.STATUS);
  const statusLabel = getOrderDisplayStatus(o);
  const priorityLabel = getOrderDisplayPriority(o);
  const typeLabel = getOrderDisplayType(o);
  const pmTypeLabel = getOrderDisplayPMType(o);
  const equipmentLabel = getOrderDisplayEquipment(o);
  const problemText = getOrderDisplayProblem(o);
  const p = String(priorityLabel || o.ORDER_PRIORITY || "").toLowerCase();

  let cls = "";
  if (p.includes("urgent")) cls = "urgent";
  if (p.includes("emergency")) cls = "emergency";
  if (isPartsStatus(s)) cls = "parts";
  if (isClosedStatus(s)) cls = "closed";

  const pdfUrl = o.PDF_EN_URL || "";
  const pdfButton = pdfUrl
    ? `<button class="pdf-btn" onclick="openInvoicePdf('${jsEsc(pdfUrl)}')">View Invoice PDF</button>`
    : `<button class="pdf-btn missing" disabled>No Invoice PDF Yet</button>`;

  return `
  <div class="card ${cls}">
    <div class="card-top">
      <div>
        <b>${esc(o.WO_NUMBER)}</b><br>
        NSN ${esc(o.NSN)}
        <div class="status">${esc(statusLabel || "No Status")}</div>
      </div>
      <div class="age-badge">${getAge(o)}</div>
    </div>

    <div class="small"><b>Technician:</b> ${esc(o.TECHNICIAN || "Not assigned")}</div>
    ${typeLabel ? `<div class="small"><b>Type:</b> ${esc(typeLabel)}</div>` : ""}
    ${pmTypeLabel ? `<div class="small"><b>PM Type:</b> ${esc(pmTypeLabel)}</div>` : ""}
    <div class="small"><b>Address:</b> ${esc(o.STORE_ADDRESS || "")}</div>
    <div class="small"><b>Equipment:</b> ${esc(equipmentLabel || "")}</div>
    <div class="small"><b>Priority:</b> ${esc(priorityLabel || "")}</div>

    <div class="problem">${esc(problemText || "")}</div>

    ${renderStatusProgress(o)}

    ${pdfButton}

    ${renderPMReportButtons(o)}

    ${renderQuoteButtons(o)}

<div style="margin-top:10px;">
  <button style="background:#0f766e;" onclick="messageAdmin(${o.ROW_NUMBER})">
    Message Admin
  </button>
</div>
  </div>`;
}

function renderPMReportButtons(o) {
  const reportEs = o.PM_REPORT_ES_URL || "";
  const reportEn = o.PM_REPORT_EN_URL || "";
  const isPM = String(o.WO_TYPE || "").toUpperCase().includes("PM");

  if (!reportEs && !reportEn) {
    return isPM
      ? `<button class="report-btn missing" disabled>No PM Report Yet</button>`
      : "";
  }

  return `
    <div style="margin-top:10px;">
      ${reportEn ? `<button class="report-btn" onclick="openPMReportPdf('${jsEsc(reportEn)}')">View PM Report EN</button>` : ""}
      ${reportEs ? `<button class="report-btn" onclick="openPMReportPdf('${jsEsc(reportEs)}')">View PM Report ES</button>` : ""}
    </div>
  `;
}

function renderQuoteButtons(o) {
  const quoteEn = o.QUOTE_EN_URL || "";
  const quoteEs = o.QUOTE_ES_URL || "";
  const quoteStatus = String(o.QUOTE_STATUS || "").toUpperCase();
  const row = o.ROW_NUMBER;

  if (!quoteEn && !quoteEs) {
    return "";
  }

  let html = `
    <div style="margin-top:10px;">
      ${quoteEn ? `<button class="quote-btn" onclick="openQuotePdf('${jsEsc(quoteEn)}')">View Quote EN</button>` : ""}
      ${quoteEs ? `<button class="quote-btn" onclick="openQuotePdf('${jsEsc(quoteEs)}')">View Quote ES</button>` : ""}
    </div>
  `;

  if (quoteStatus === "APPROVED") {
    html += `<div class="quote-approved-label">Quote Approved</div>`;
  } else {
    html += `
      <div>
        <button class="quote-approved-btn" onclick="approveQuoteFromCustomer(${row})">
          Quote Approved
        </button>
      </div>
    `;
  }

  return html;
}

function approveQuoteFromCustomer(row) {
  if (!confirm("Approve this quote?")) return;

  google.script.run
    .withSuccessHandler(function() {
      alert("Quote approved successfully.");
      loadOrders();
    })
    .withFailureHandler(function(err) {
      alert(err.message);
    })
    .approveQuote(row, getSessionToken());
}

function openQuotePdf(url) {
  if (!url) {
    alert("No quote PDF is available.");
    return;
  }

  window.open(url, "_blank");
}

function openPMReportPdf(url) {
  if (!url) {
    alert("No PM report PDF is available for this order yet.");
    return;
  }

  window.open(url, "_blank");
}

function renderStatusProgress(o) {
  const status = normalizeStatus(o.STATUS);
  const hasInvoice = String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES";

  const steps = [
    { key: "RECEIVED", label: "Received" },
    { key: "SENT_TO_TECH", label: "Sent to Technician" },
    { key: "IN_PROGRESS", label: "In Progress" },
    { key: "BUYING_PARTS", label: "Buying Parts" },
    { key: "PARTS_READY", label: "Parts Ready" },
    { key: "COMPLETED", label: "Completed" },
    { key: "INVOICED", label: "Invoiced" }
  ];

  let currentIndex = getProgressIndex(status);

  if (hasInvoice && currentIndex < 6) {
    currentIndex = 6;
  }

  return `
    <div class="progress-box">
      <div class="progress-title">Order Status Progress</div>
      <div class="steps">
        ${steps.map(function(step, index) {
          const done = index <= currentIndex ? "done" : "";
          return `
            <div class="step ${done}">
              <div class="dot"></div>
              <span>${step.label}</span>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function getProgressIndex(status) {
  status = normalizeStatus(status);

  if (status.includes("INVOICED") || status.includes("FACTURADO")) return 6;
  if (status.includes("COMPLETED") || status.includes("CLOSED") || status.includes("COMPLETADO")) return 5;
  if (status.includes("PARTS READY") || status.includes("PARTS_RECEIVED") || status.includes("PARTS RECEIVED")) return 4;
  if (status.includes("PART") || status.includes("BUYING") || status.includes("COMPRANDO")) return 3;
  if (status.includes("IN PROGRESS") || status.includes("ON SITE") || status.includes("TRABAJANDO")) return 2;
  if (status.includes("SENT") || status.includes("ASSIGNED") || status.includes("TECH") || status.includes("ENVIADA")) return 1;
  if (status.includes("RECEIVED") || status.includes("RECIBIDO") || status.includes("RECIBIDA")) return 0;

  return 0;
}

function getOrderDisplayStatus(o) {
  return o.SUPERVISOR_STATUS_EN || translateStatusToEnglish(o.STATUS);
}

function getOrderDisplayPriority(o) {
  return o.SUPERVISOR_PRIORITY_EN || translatePriorityToEnglish(o.ORDER_PRIORITY);
}

function getOrderDisplayType(o) {
  return o.SUPERVISOR_WO_TYPE_EN || translateWorkOrderTypeToEnglish(o.WO_TYPE);
}

function getOrderDisplayPMType(o) {
  return o.SUPERVISOR_PM_TYPE_EN || translatePMTypeToEnglish(o.PM_TYPE);
}

function getOrderDisplayEquipment(o) {
  return o.SUPERVISOR_EQUIPMENT_EN || o.REPORTED_EQUIPMENT_EN || o.REPORTED_EQUIPMENT || "";
}

function getOrderDisplayProblem(o) {
  return o.SUPERVISOR_PROBLEM_EN ||
    o.REPORTED_PROBLEM_EN ||
    o.REPORTED_PROBLEM_ES ||
    o.REPORTED_PROBLEM_ORIGINAL ||
    "";
}

function translateStatusToEnglish(value) {
  const raw = String(value || "").trim();
  const status = normalizeStatus(raw);

  if (!status) return "No Status";
  if (status.includes("DELETED")) return "Deleted";
  if (status.includes("INVOICED") || status.includes("FACTURADO")) return "Invoiced";
  if (status.includes("CLOSED") || status.includes("CERRAD")) return "Closed";
  if (status.includes("COMPLETED") || status.includes("COMPLETADO")) return "Completed";
  if (status.includes("PARTS READY") || status.includes("PARTS RECEIVED") || status.includes("PIEZAS RECIBID")) return "Parts Ready";
  if (status.includes("PARTS IN TRANSIT") || status.includes("PARTS TRANSIT")) return "Parts in Transit";
  if (status.includes("REQUEST PART") || status.includes("PARTS REQUESTED") || status.includes("SOLICIT")) return "Parts Requested";
  if (status.includes("BUYING") || status.includes("COMPRANDO")) return "Buying Parts";
  if (status.includes("IN PROGRESS") || status.includes("ON SITE") || status.includes("TRABAJANDO") || status.includes("PROGRESO")) return "In Progress";
  if (status.includes("SENT") || status.includes("ASSIGNED") || status.includes("TECH") || status.includes("ENVIADA") || status.includes("ASIGNADA")) return "Sent to Technician";
  if (status.includes("ORDER RECEIVED") || status.includes("RECEIVED") || status.includes("RECIBID")) return "Order Received";

  return titleCaseText(raw.replace(/_/g, " "));
}

function translatePriorityToEnglish(value) {
  const priority = normalizeStatus(value);

  if (priority.includes("EMERGENCY") || priority.includes("EMERGENCIA")) return "Emergency";
  if (priority.includes("URGENT") || priority.includes("URGENTE")) return "Urgent";
  if (priority.includes("NORMAL")) return "Normal";

  return titleCaseText(String(value || ""));
}

function translateWorkOrderTypeToEnglish(value) {
  const raw = String(value || "").trim();
  const type = normalizeStatus(raw);

  if (!type) return "";
  if (type.includes("PM")) return "Preventive Maintenance";
  if (type.includes("REPAIR")) return "Repair";
  if (type.includes("INSTALL")) return "Installation";
  if (type.includes("QUOTE")) return "Quote";
  if (type.includes("EMERGENCY")) return "Emergency Service";

  return titleCaseText(raw.replace(/_/g, " "));
}

function translatePMTypeToEnglish(value) {
  const raw = String(value || "").trim();
  const type = normalizeStatus(raw);

  if (!type) return "";
  if (type.includes("QUARTER")) return "Quarterly";
  if (type.includes("MONTH")) return "Monthly";
  if (type.includes("SEMI")) return "Semiannual";
  if (type.includes("ANNUAL") || type.includes("YEAR")) return "Annual";

  return titleCaseText(raw.replace(/_/g, " "));
}

function isClosedStatus(value) {
  const status = normalizeStatus(value);
  return status.includes("COMPLETED") ||
    status.includes("CLOSED") ||
    status.includes("INVOICED") ||
    status.includes("COMPLETADO") ||
    status.includes("CERRAD") ||
    status.includes("FACTURADO");
}

function isPartsStatus(value) {
  const status = normalizeStatus(value);
  return status.includes("PART") ||
    status.includes("PIEZA") ||
    status.includes("COMPRANDO") ||
    status.includes("SOLICIT");
}

function isEmergencyPriority(value) {
  const priority = normalizeStatus(value);
  return priority.includes("EMERGENCY") ||
    priority.includes("EMERGENCIA") ||
    priority.includes("URGENT") ||
    priority.includes("URGENTE");
}

function titleCaseText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\b[a-z]/g, function(letter) {
      return letter.toUpperCase();
    });
}

function normalizeStatus(v) {
  return String(v || "")
    .trim()
    .replace(/_/g, " ")
    .toUpperCase();
}

function openInvoicePdf(url) {
  if (!url) {
    alert("No invoice PDF is available for this order yet.");
    return;
  }

  window.open(url, "_blank");
}

function getAge(o) {
  const d = new Date(o.DATE_CREATED || "");
  if (isNaN(d)) return "";
  const diff = Math.floor((new Date() - d) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "1 day";
  return diff + " days";
}

function messageAdmin(row) {
  const msg = prompt("Write your message about this order:");

  if (msg === null) return;

  const cleanMsg = String(msg || "").trim();

  if (!cleanMsg) {
    alert("Message cannot be empty.");
    return;
  }

  google.script.run
    .withSuccessHandler(function() {
      alert("Message sent successfully.");
    })
    .withFailureHandler(function(err) {
      alert(err.message);
    })
    .sendSupervisorOrderMessage(row, SUPERVISOR, cleanMsg, getSessionToken());
}

document.addEventListener("DOMContentLoaded", function() {
  loadHeader();
  loadOrders();
});
</script>
