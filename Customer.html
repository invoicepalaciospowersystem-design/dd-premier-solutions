<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background:#f3f4f6;
      margin:0;
      padding:15px;
      color:#111827;
    }

    .header {
      background:white;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .topbar {
      margin-bottom:15px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    button {
      padding:10px 14px;
      border-radius:10px;
      border:none;
      font-size:14px;
      color:white;
      font-weight:bold;
      background:#111827;
      cursor:pointer;
      margin-right:6px;
    }

    button:disabled {
      background:#9ca3af;
      cursor:not-allowed;
    }

    .pdf-btn {
      background:#2563eb;
      margin-top:10px;
    }

    .pdf-btn.missing {
      background:#9ca3af;
    }

    .quote-btn {
      background:#7c3aed;
      margin-top:10px;
    }

    .report-btn {
      background:#0f766e;
      margin-top:10px;
    }

    .report-btn.missing {
      background:#9ca3af;
    }

    .quote-approved-btn {
      background:#16a34a;
      margin-top:10px;
    }

    .quote-approved-label {
      background:#dcfce7;
      color:#166534;
      padding:8px 10px;
      border-radius:10px;
      font-weight:bold;
      margin-top:10px;
      display:inline-block;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
      gap:15px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
      border-left:6px solid #16a34a;
    }

    .urgent { border-left-color:orange; }
    .emergency { border-left-color:red; }
    .parts { border-left-color:#7c3aed; }
    .closed { border-left-color:#6b7280; }

    .card-top {
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .status {
      background:#e5e7eb;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      margin-top:5px;
      display:inline-block;
    }

    .age-badge {
      background:#111827;
      color:white;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      white-space:nowrap;
    }

    .small {
      font-size:14px;
      margin:6px 0;
    }

    .problem {
      background:#f9fafb;
      padding:10px;
      border-radius:10px;
      margin-top:8px;
      white-space:pre-wrap;
    }

    .progress-box {
      margin-top:12px;
      background:#f9fafb;
      border-radius:12px;
      padding:10px;
    }

    .progress-title {
      font-size:13px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .steps {
      display:grid;
      gap:6px;
    }

    .step {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
    }

    .dot {
      width:13px;
      height:13px;
      border-radius:50%;
      background:#dc2626;
      flex:none;
    }

    .step.done .dot {
      background:#16a34a;
    }

    .step.done span {
      font-weight:bold;
      color:#166534;
    }

    .stats {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:10px 0 15px;
    }

    .stat {
      background:white;
      padding:10px 14px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.07);
      font-size:14px;
    }

    @media (max-width:420px) {
      .grid { grid-template-columns:1fr; }
      .card { width:100%; }
      .header { display:block; }
    }
  </style>
</head>

<body>

<div class="header">
  <div id="companyTitle" style="font-size:20px; font-weight:bold;">
    Company: Loading...
  </div>

  <div>
    <b>D&D Premier Solutions Corp</b><br>
    <small>Supervisor Order Portal</small>
  </div>
</div>

<h2>Supervisor Portal</h2>
<div>Supervisor: <b><?= supervisor ?></b></div>

<div class="topbar">
  <button onclick="loadOrders()">Refresh</button>
</div>

<div id="stats" class="stats"></div>
<div id="orders" class="grid">Loading...</div>

<script>
const SUPERVISOR = "<?= supervisor ?>";

function esc(v) {
  return String(v || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function jsEsc(v) {
  return String(v || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');
}

function loadHeader() {
  google.script.run
    .withSuccessHandler(function(name) {
      document.getElementById("companyTitle").innerText = "Company: " + name;
    })
    .getSupervisorCompany(SUPERVISOR);
}

function loadOrders() {
  document.getElementById("orders").innerHTML = "Loading...";

  google.script.run
    .withSuccessHandler(function(data) {
      render(data || []);
    })
    .withFailureHandler(function(err) {
      document.getElementById("orders").innerHTML = "ERROR: " + err.message;
    })
    .getCustomerOrdersBySupervisor(SUPERVISOR);
}

function render(data) {
  renderStats(data);

  if (!data.length) {
    document.getElementById("orders").innerHTML = "No orders found.";
    return;
  }

  document.getElementById("orders").innerHTML = data.map(card).join("");
}

function renderStats(data) {
  const total = data.length;
  const completed = data.filter(o => normalizeStatus(o.STATUS).includes("COMPLETED") || normalizeStatus(o.STATUS).includes("CLOSED")).length;
  const parts = data.filter(o => normalizeStatus(o.STATUS).includes("PART")).length;
  const emergency = data.filter(o => String(o.ORDER_PRIORITY || "").toLowerCase().includes("emergency")).length;
  const invoiced = data.filter(o => String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES").length;
  const quotes = data.filter(o => o.QUOTE_EN_URL || o.QUOTE_ES_URL).length;
  const pmReports = data.filter(o => String(o.HAS_PM_REPORT_PDF || "").toUpperCase() === "YES").length;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>Total Orders:</b> ${total}</div>
    <div class="stat"><b>Completed:</b> ${completed}</div>
    <div class="stat"><b>Buying Parts:</b> ${parts}</div>
    <div class="stat"><b>Invoiced:</b> ${invoiced}</div>
    <div class="stat"><b>Quotes:</b> ${quotes}</div>
    <div class="stat"><b>PM Reports:</b> ${pmReports}</div>
    <div class="stat"><b>Emergency:</b> ${emergency}</div>
  `;
}

function card(o) {
  const s = normalizeStatus(o.STATUS);
  const p = String(o.ORDER_PRIORITY || "").toLowerCase();

  let cls = "";
  if (p.includes("urgent")) cls = "urgent";
  if (p.includes("emergency")) cls = "emergency";
  if (s.includes("PART")) cls = "parts";
  if (s === "CLOSED" || s === "COMPLETED") cls = "closed";

  const pdfUrl = o.PDF_EN_URL || "";
  const pdfButton = pdfUrl
    ? `<button class="pdf-btn" onclick="openInvoicePdf('${jsEsc(pdfUrl)}')">View Invoice PDF</button>`
    : `<button class="pdf-btn missing" disabled>No Invoice PDF Yet</button>`;

  return `
  <div class="card ${cls}">
    <div class="card-top">
      <div>
        <b>${esc(o.WO_NUMBER)}</b><br>
        NSN ${esc(o.NSN)}
        <div class="status">${esc(o.STATUS || "NO STATUS")}</div>
      </div>
      <div class="age-badge">${getAge(o)}</div>
    </div>

    <div class="small"><b>Technician:</b> ${esc(o.TECHNICIAN || "Not assigned")}</div>
    <div class="small"><b>Address:</b> ${esc(o.STORE_ADDRESS || "")}</div>
    <div class="small"><b>Equipment:</b> ${esc(o.REPORTED_EQUIPMENT || "")}</div>
    <div class="small"><b>Priority:</b> ${esc(o.ORDER_PRIORITY || "")}</div>

    <div class="problem">${esc(o.REPORTED_PROBLEM_EN || o.REPORTED_PROBLEM_ES || "")}</div>

    ${renderStatusProgress(o)}

    ${pdfButton}

    ${renderPMReportButtons(o)}

    ${renderQuoteButtons(o)}

<div style="margin-top:10px;">
  <button style="background:#0f766e;" onclick="messageAdmin(${o.ROW_NUMBER})">
    Message Admin
  </button>
</div>
  </div>`;
}

function renderPMReportButtons(o) {
  const reportEs = o.PM_REPORT_ES_URL || "";
  const reportEn = o.PM_REPORT_EN_URL || "";
  const folderUrl = o.PM_REPORT_FOLDER_URL || "";
  const isPM = String(o.WO_TYPE || "").toUpperCase().includes("PM");

  if (!reportEs && !reportEn && !folderUrl) {
    return isPM
      ? `<button class="report-btn missing" disabled>No PM Report Yet</button>`
      : "";
  }

  return `
    <div style="margin-top:10px;">
      ${reportEn ? `<button class="report-btn" onclick="openPMReportPdf('${jsEsc(reportEn)}')">View PM Report EN</button>` : ""}
      ${reportEs ? `<button class="report-btn" onclick="openPMReportPdf('${jsEsc(reportEs)}')">View PM Report ES</button>` : ""}
      ${folderUrl ? `<button class="report-btn" onclick="openPMReportPdf('${jsEsc(folderUrl)}')">Open PM Folder</button>` : ""}
    </div>
  `;
}

function renderQuoteButtons(o) {
  const quoteEn = o.QUOTE_EN_URL || "";
  const quoteEs = o.QUOTE_ES_URL || "";
  const quoteStatus = String(o.QUOTE_STATUS || "").toUpperCase();
  const row = o.ROW_NUMBER;

  if (!quoteEn && !quoteEs) {
    return "";
  }

  let html = `
    <div style="margin-top:10px;">
      ${quoteEn ? `<button class="quote-btn" onclick="openQuotePdf('${jsEsc(quoteEn)}')">View Quote EN</button>` : ""}
      ${quoteEs ? `<button class="quote-btn" onclick="openQuotePdf('${jsEsc(quoteEs)}')">View Quote ES</button>` : ""}
    </div>
  `;

  if (quoteStatus === "APPROVED") {
    html += `<div class="quote-approved-label">Quote Approved</div>`;
  } else {
    html += `
      <div>
        <button class="quote-approved-btn" onclick="approveQuoteFromCustomer(${row})">
          Quote Approved
        </button>
      </div>
    `;
  }

  return html;
}

function approveQuoteFromCustomer(row) {
  if (!confirm("Approve this quote?")) return;

  google.script.run
    .withSuccessHandler(function() {
      alert("Quote approved successfully.");
      loadOrders();
    })
    .withFailureHandler(function(err) {
      alert(err.message);
    })
    .approveQuote(row);
}

function openQuotePdf(url) {
  if (!url) {
    alert("No quote PDF is available.");
    return;
  }

  window.open(url, "_blank");
}

function openPMReportPdf(url) {
  if (!url) {
    alert("No PM report PDF is available for this order yet.");
    return;
  }

  window.open(url, "_blank");
}

function renderStatusProgress(o) {
  const status = normalizeStatus(o.STATUS);
  const hasInvoice = String(o.HAS_INVOICE_PDF || "").toUpperCase() === "YES";

  const steps = [
    { key: "RECEIVED", label: "Received" },
    { key: "SENT_TO_TECH", label: "Sent to Technician" },
    { key: "IN_PROGRESS", label: "In Progress" },
    { key: "BUYING_PARTS", label: "Buying Parts" },
    { key: "PARTS_READY", label: "Parts Ready" },
    { key: "COMPLETED", label: "Completed" },
    { key: "INVOICED", label: "Invoiced" }
  ];

  let currentIndex = getProgressIndex(status);

  if (hasInvoice && currentIndex < 6) {
    currentIndex = 6;
  }

  return `
    <div class="progress-box">
      <div class="progress-title">Order Status Progress</div>
      <div class="steps">
        ${steps.map(function(step, index) {
          const done = index <= currentIndex ? "done" : "";
          return `
            <div class="step ${done}">
              <div class="dot"></div>
              <span>${step.label}</span>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function getProgressIndex(status) {
  status = normalizeStatus(status);

  if (status.includes("INVOICED") || status.includes("FACTURADO")) return 6;
  if (status.includes("COMPLETED") || status.includes("CLOSED") || status.includes("COMPLETADO")) return 5;
  if (status.includes("PARTS READY") || status.includes("PARTS_RECEIVED") || status.includes("PARTS RECEIVED")) return 4;
  if (status.includes("PART") || status.includes("BUYING") || status.includes("COMPRANDO")) return 3;
  if (status.includes("IN PROGRESS") || status.includes("ON SITE") || status.includes("TRABAJANDO")) return 2;
  if (status.includes("SENT") || status.includes("ASSIGNED") || status.includes("TECH") || status.includes("ENVIADA")) return 1;
  if (status.includes("RECEIVED") || status.includes("RECIBIDO") || status.includes("RECIBIDA")) return 0;

  return 0;
}

function normalizeStatus(v) {
  return String(v || "")
    .trim()
    .replace(/_/g, " ")
    .toUpperCase();
}

function openInvoicePdf(url) {
  if (!url) {
    alert("No invoice PDF is available for this order yet.");
    return;
  }

  window.open(url, "_blank");
}

function getAge(o) {
  const d = new Date(o.DATE_CREATED || "");
  if (isNaN(d)) return "";
  const diff = Math.floor((new Date() - d) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "1 day";
  return diff + " days";
}

function messageAdmin(row) {
  const msg = prompt("Write your message about this order:");

  if (msg === null) return;

  const cleanMsg = String(msg || "").trim();

  if (!cleanMsg) {
    alert("Message cannot be empty.");
    return;
  }

  google.script.run
    .withSuccessHandler(function() {
      alert("Message sent successfully.");
    })
    .withFailureHandler(function(err) {
      alert(err.message);
    })
    .sendSupervisorOrderMessage(row, SUPERVISOR, cleanMsg);
}

document.addEventListener("DOMContentLoaded", function() {
  loadHeader();
  loadOrders();
});
</script>

</body>
</html>
